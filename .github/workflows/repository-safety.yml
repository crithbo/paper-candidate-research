name: repository-safety

on:
  push:
    branches: [main, "exec/**"]
  pull_request:
    branches: [main]

jobs:
  snapshot-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_repository_snapshot.py

