schema: research-artifact-catalog-v1
catalog_mode: EXTERNAL_BYTES__GIT_METADATA_ONLY
canonical_repository_branch: main
resource_bytes_in_git: forbidden
git_lfs_default: OFF
external_store:
  status: NOT_YET_SELECTED
  allowed_kinds: [local_archive, NAS, object_store, hash_pinned_manual_transfer]
  required_identity: [artifact_id, sha256, logical_bytes, provenance, license, reacquire_route]
tracked_evidence:
  - canonical reports and decisions
  - handoffs and targeted manifests
  - RESOURCE_INVENTORY and lifecycle receipts outside resource roots
  - minimum claim-critical source or fixtures promoted out of resources
  - terminal evidence capsules
excluded_legacy_classes:
  - assignment-local resources directories
  - downloads and archives
  - isolated Python or compiler environments
  - build outputs and caches
  - LLVM toolchains, wheels, DLLs and executable binaries
  - copied third-party source, tools, assets and verified vendor trees
promotion_rule:
  source_location: assignment resources
  tracked_destination: repro/<topic_id>/
  required_record: source_path_source_sha256_destination_path_destination_sha256
  mainline_acceptance_required: true
