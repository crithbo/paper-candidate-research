precommitted_checks:
  G0_IDENTITY_AND_PRESERVATION:
    pass_only_if:
      - SAME_TOPIC_EXACT_OBJECT_AND_WITNESS
      - A2_87_OF_87_A1_37_OF_37_PASS1_22_OF_22_PRESERVED
      - NO_OWNER_OR_SHARED_MUTATION_OUTSIDE_ASSIGNMENT
    fail_if:
      - TOPIC_OBJECT_WITNESS_ACTION_BASELINE_OR_ENDPOINT_CHANGED
      - ANY_ACCEPTED_CEILING_ARTIFACT_IS_MISSING_OR_HASH_DRIFTED
      - REVIEW_REQUIRES_OWNER_OR_SHARED_MUTATION
  G1_TRANSITIVE_SPLIT_GRAPH:
    pass_only_if:
      - ROOTS_DERIVED_FROM_NATIVE_MIR
      - TRANSITIVE_ANCESTRY_CLOSED
      - NO_HARDCODED_REGISTER_IDS
      - CYCLE_UNKNOWN_PARENT_CROSS_CLASS_OR_LMUL_FAIL_CLOSED
    fail_if:
      - IMMEDIATE_PARENT_SUMMARY_IS_PRESENTED_AS_TRANSITIVE_CLOSURE
      - ROOT_OR_DESCENDANT_SET_DEPENDS_ON_FROZEN_REGISTER_LITERALS
      - MALFORMED_ANCESTRY_CAN_ESCAPE_OR_BE_SILENTLY_DROPPED
  G2_QUOTIENT_AND_FUTURE_ACTION_COST:
    pass_only_if:
      - FUTURE_ACTION_SIGNATURE_IN_STATE
      - FUTURE_COST_OR_OBLIGATION_DEPENDENCY
      - PARENT_ACTION_BACKPOINTER_CLOSURE
      - ZERO_ORPHAN_OR_MULTIROOT_DESCENDANT
    fail_if:
      - QUOTIENT_IS_ONLY_SERIALIZED_STATE_DEDUPLICATION
      - FUTURE_ACTION_COST_OR_OBLIGATION_DOES_NOT_AFFECT_EQUIVALENCE
      - ORPHAN_OR_MULTIROOT_DESCENDANT_PASSES
  G3_NATIVE_REPLAY_RECEIPTS:
    pass_only_if:
      - TWO_FRESH_LLC_MACHINEVERIFIER_COMMANDS_EXIT_ZERO
      - BYTE_EXACT_REPLAY
      - EXACT_ARGV_CWD_EXIT_STDOUT_STDERR_OUTPUT_HASH_RECEIPTS
      - RETRY_ZERO
    fail_if:
      - RECEIPT_FIELDS_DO_NOT_RESOLVE_TO_HASH_MATCHING_RAW_ARTIFACTS
      - REPLAY_IS_NOT_BYTE_EXACT_OR_NOT_PINNED_TO_THE_FROZEN_WITNESS
      - ANY_RETRY_OR_RESULT_BASED_EXCLUSION_OCCURRED
  G4_F3_F4_F5_DEPENDENCY:
    pass_only_if:
      - F3_PASS
      - F4_CONSUMES_EXACT_CLOSURE_HASH
      - F5_CONSUMES_EXACT_CLOSURE_HASH
      - MUTATED_CLOSURE_OR_HASH_FAILS
    fail_if:
      - F4_OR_F5_ONLY_REPORTS_THE_CLOSURE_HASH_WITHOUT_DECISIVE_CONSUMPTION
      - SPLIT_CLOSURE_AND_F3_F4_F5_ARE_PARALLEL_UNCONNECTED_CONTROLS
      - MUTATED_GRAPH_FUTURE_ACTION_OR_HASH_CAN_PASS
  G5_NEGATIVE_CONTROLS:
    pass_only_if:
      - EXACT_12_CASE_KEY_SET
      - ALL_12_EXPECTED_FAIL_OR_CONTROL_VALUES_TRUE
      - CASE_NAMES_COUNT_GENERATORS_VALUES_AND_POLARITY_UNCHANGED
      - ORDER_NOT_SEMANTIC
    fail_if:
      - ANY_REQUIRED_CASE_IS_MISSING_RENAMED_DUPLICATED_OR_POLARITY_FLIPPED
      - CASE_SUCCESS_DEPENDS_ON_ORDER_OR_POSTRESULT_EXCLUSION
  G6_REPRODUCIBILITY_AND_RESOURCE:
    pass_only_if:
      - NO_NEW_PYC
      - NETWORK_ZERO
      - NATURAL_SELECTED_CLAIM_ZERO
      - ACTIVE_PROCESS_ZERO
      - REPARSE_ZERO
      - MANIFEST_COMPLETE
    fail_if:
      - UNINVENTORIED_OR_HASH_MISMATCHING_CLAIM_CRITICAL_ARTIFACT
      - NATIVE_NATURAL_SELECTED_CLAIM_RESOURCE_OR_CLEANUP_ACTION_BY_REVIEWER
      - ACTIVE_PROCESS_REPARSE_POINT_OR_NEW_PYC_PRESENT
  G7_NEXT_ROUTE:
    pass_route_only_if:
      - G0_THROUGH_G6_ALL_PASS
      - NEXT_ROUTE_IS_SEPARATE_NATURAL_CORPUS_AND_CLAIM_CONTRACT_ASSIGNMENT
      - NO_SECOND_PIVOT_REVISION_STAGEB_STATE_OR_SCIENTIFIC_INFERENCE_IS_CREATED
    reject_route_only_if:
      - A_SPECIFIC_REMAINING_FIDELITY_DEFECT_HAS_A_FINITE_SAME_OBJECT_ENGINEERING_ROUTE
      - OR_A_HARD_BLOCKER_PREVENTS_PRECLAIM_FIDELITY_ACCEPTANCE
    fail_if:
      - PRECLAIM_ACCEPTANCE_IS_RELABELED_AS_FORMAL_STAGEA_PASS
      - CORRECTION_REQUIRES_SECOND_PIVOT_OR_SCIENTIFIC_REVISION

allowed_dispositions:
  - ACCEPT_PRECLAIM_FIDELITY__READY_FOR_SEPARATE_NATURAL_CLAIM_ASSIGNMENT__NO_SCIENTIFIC_INFERENCE
  - REJECT_PRECLAIM_FIDELITY__SPECIFIC_BOUNDED_ROUTE_OR_HARD_BLOCKER__NO_SCIENTIFIC_INFERENCE
  - PROVENANCE_FAIL

