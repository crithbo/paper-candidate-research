      - EXACT_COMMIT_OBJECT_WITNESS_ACTION_BASELINE_AND_PRECLAIM_GATE_UNCHANGED
      - SPLIT_PROVENANCE_CLOSURE_IS_THE_SINGLE_CONSUMED_STAGEA_MECHANISM_PIVOT
