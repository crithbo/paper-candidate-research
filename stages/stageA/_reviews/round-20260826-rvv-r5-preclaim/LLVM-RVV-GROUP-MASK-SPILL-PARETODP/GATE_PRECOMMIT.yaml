      - SPLIT_CHILDREN_ARE_DROPPED_TO_RECOVER_THE_OLD_QUOTIENT
  G1_SPLIT_PROVENANCE_COMPLETENESS:
    pass_only_if:
      - EVERY_SPLIT_FROM_EDGE_IN_THE_FROZEN_REPLAY_IS_DISCOVERED
      - PARENT_CHILD_TRANSITIVE_CLOSURE_IS_NOT_RESTRICTED_TO_A_HARDCODED_UNVERIFIED_SUBSET
      - CLASS_LMUL_MASK_LIVENESS_INTERFERENCE_PHYSREG_SPILL_RELOAD_FUTURE_USE_AND_BACKPOINTER_FIELDS_ARE_DERIVED_FROM_RAW_MIR
      - EACH_PROVENANCE_STATE_HAS_AN_AUDITABLE_PATH_FROM_PARENT_THROUGH_SPILL_RELOAD_TO_FUTURE_USE
      - QUOTIENT_STATE_CONSUMES_THE_PROVENANCE_FIELDS_RATHER_THAN_REPORTING_THEM_ONLY
    fail_if:
      - IMMEDIATE_CHILD_SUMMARY_IS_PRESENTED_AS_TRANSITIVE_CLOSURE_WITHOUT_RECURSION_OR_COMPLETE_WITNESS_PROOF
      - QUOTIENT_EQUALITY_IS_COMPUTED_FROM_SERIALIZED_STATE_UNIQUENESS_INSTEAD_OF_FUTURE_ACTION_COST_EQUIVALENCE
  G2_NO_SPLIT_ESCAPE_LOWERING:
    pass_only_if:
      - MISSING_CHILD_UNKNOWN_PARENT_CROSS_CLASS_MISSING_SPILL_AND_MISSING_RELOAD_FUTURE_USE_ALL_FAIL_CLOSED
      - UNKNOWN_LMUL_OR_MISSING_MASK_OR_PHYSREG_OR_BACKPOINTER_CANNOT_PASS
      - MACHINEVERIFIER_AND_NATIVE_REPLAY_REQUIREMENTS_REMAIN_UNCHANGED
    fail_if:
      - ANY_SPLIT_CHILD_OR_CROSS_CLASS_CASE_IS_IGNORED
      - MACHINEVERIFIER_IS_LOWERED_BYPASSED_OR_REPLACED_BY_TEXT_ONLY_ACCEPTANCE
  G3_NATIVE_REPLAY_FIDELITY:
    pass_only_if:
      - TWO_FRESH_LLC_MACHINEVERIFIER_REPLAYS_EXIST
      - BOTH_REPLAYS_ARE_BYTE_EXACT_AND_HASH_PINNED_TO_THE_FROZEN_WITNESS
      - NO_RETRY_OR_RESULT_BASED_EXCLUSION_OCCURRED
  G4_F3_F5_AND_QUOTIENT:
    pass_only_if:
      - F3_TYPED_REPLAY_F4_QUOTIENT_ORACLE_AND_F5_BASELINE_FULL_COST_CONTROL_REMAIN_VALID
      - F4_LABELED_AND_QUOTIENT_STATES_EXPLICITLY_INCLUDE_OR_CONSUME_SPLIT_PROVENANCE_OBLIGATIONS
      - F5_BASELINES_AND_CANDIDATE_CONSUME_THE_SAME_SPLIT_CLOSED_ACTION_GRAMMAR_AND_COSTS
      - REPLAYING_UNCHANGED_OLD_F3_F5_FILES_WITH_NO_DEPENDENCY_ON_SPLIT_CLOSURE_DOES_NOT_COUNT_AS_CLOSURE
    fail_if:
      - SPLIT_CLOSURE_AND_F3_F5_ARE_PARALLEL_UNCONNECTED_CONTROLS
      - CANDIDATE_EQUALS_GENERIC_OR_LABELED_EXACT_SUBTRACTOR_WITH_NO_MATERIAL_QUOTIENT_RESIDUAL_AND_THIS_IS_HIDDEN
  G5_NEXT_ROUTE:
    natural_route_pass_only_if:
      - G0_THROUGH_G4_PASS
      - SEPARATE_HASH_PINNED_NATURAL_ASSIGNMENT_HAS_FIXED_PUBLIC_DENOMINATOR_STRONG_BASELINES_FULL_COST_FAILURE_REGION_AND_ZERO_POSTRESULT_TUNING
      - NO_SECOND_PIVOT_OR_REVISION_IS_REQUIRED
    engineering_correction_route_allowed_only_if:
      - DEFECT_IS_ASSIGNMENT_LOCAL_PARSER_CHECKER_OR_DEPENDENCY_CONSUMPTION
      - FROZEN_MECHANISM_ACTION_OBJECT_BASELINE_AND_GATE_REMAIN_UNCHANGED
      - A_FRESH_PRECLAIM_REPLAY_CAN_CLOSE_THE_DEFECT_WITHOUT_SECOND_PIVOT_OR_REVISION
    no_valid_route_if:
      - CLOSURE_REQUIRES_ANOTHER_MECHANISM_CHANGE
      - VALIDATION_REQUIRES_LOWERING_THE_SPLIT_OR_QUOTIENT_GATE
      - SCIENTIFIC_REVISION_OR_SECOND_PIVOT_IS_REQUIRED

