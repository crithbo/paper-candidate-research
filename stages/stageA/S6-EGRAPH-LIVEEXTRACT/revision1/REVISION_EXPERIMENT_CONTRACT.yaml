  test: python -m unittest -v test_revision.py
  run_1: python run_revision.py --input inputs/locked_natural_projection.json --output results/run1.json
  run_2: python run_revision.py --input inputs/locked_natural_projection.json --output results/run2.json
  validate: python validate_revision.py --source inputs/simple_vec_add_root_7.json --projection inputs/locked_natural_projection.json --run1 results/run1.json --run2 results/run2.json --output results/validation.json

