research_question: >-
  On one pinned public natural compiler e-graph, after a deterministic acyclic
  projection and with the same root, closure, semantics, target-informed
  operation/output-size mapping, allocation convention, information, and
  peak-live budget B, does the exact joint extraction/materialization/
  recomputation/scheduling oracle produce a strict non-dominated cost--peak
  point unavailable to both exact sequential controls?

source:
  system: Diospyros equality-saturation compiler for four-lane DSP vectorization
  paper: Vectorization for Digital Signal Processors via Equality Saturation, ASPLOS 2021
  paper_url: https://doi.org/10.1145/3445814.3446707
  artifact_repository: https://github.com/egraphs-good/extraction-gym.git
  artifact_commit: 903ba0f818b50608fe20ae9e0f03c35cb27bc50a
  artifact_path: data/diospyros/simple_vec_add_root_7.json
  git_blob_oid_sha1: 0a6fdaa6432a55b7c49001bd83531835efc6a1af
  raw_byte_length: 17477
