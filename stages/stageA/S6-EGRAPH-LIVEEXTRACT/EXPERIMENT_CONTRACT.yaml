schema_version: stagea-experiment-contract-v1
topic_id: S6-EGRAPH-LIVEEXTRACT
stage: STAGEA
contract_status: FROZEN_BEFORE_IMPLEMENTATION_OR_EXECUTION
frozen_on: 2026-08-09
exact_freeze_clock: NOT_CAPTURED
project_root: <LEGACY_LOCAL_PROJECT_ROOT>
write_scope: <LEGACY_LOCAL_PROJECT_ROOT>\stages\stageA\S6-EGRAPH-LIVEEXTRACT
stageb_authorized: false
positive_claim_ceiling: PRELIMINARY_SUPPORT

research_question: >-
  On a fixed pure acyclic e-graph, roots, rewrite closure, operation/output-size
  costs, allocation convention, and peak-live budget B, can joint representative
  selection plus materialization/recomputation plus legal scheduling produce a
  runtime--peak-live point strictly unavailable to either frozen sequential order?

object:
  representation: >-
    A finite mapping from e-class id to one or more e-nodes. An e-node has a
    stable id, pure deterministic operator label, ordered child e-class ids,
    nonnegative integer execution cost, and nonnegative integer output size.
  acyclicity: every e-node child has a lower topological rank than its parent e-class
  roots: frozen per input instance; all roots must be emitted
  closure: exactly the e-classes reachable from the frozen roots under the selected representatives
  semantics: one representative e-node is selected for every reachable e-class; all alternatives in an e-class are declared equivalent by the locked input
  leaves: childless input/constant e-nodes have execution cost 0 and output size 0
  approximation: forbidden
  rewrite_set_change: forbidden

allocation_and_schedule:
  resident_values: at most one materialized value per selected non-leaf e-class
  compute_precondition: all non-leaf child e-class values are resident; leaf children are always available
  recomputation: allowed only by executing the same selected representative again after its value was deleted
  deletion: any resident non-root value may be deleted at zero runtime-proxy cost
  root_emission: a computed root is marked emitted and is not resident after the action
  peak_live_definition: >-
    For a compute action, transient live bytes equal the sum of sizes of all
    resident values before the action plus the output size of the computed
    e-class. The peak is the maximum transient value over the full schedule.
  input_output_accounting: leaf inputs and already-emitted root outputs are excluded from temporary memory; the root output is charged during its producing action
  budget_B: integer peak-live bound, swept over every attainable value from 1 through the sum of maximum non-leaf e-class sizes

optimization:
  primary_objective: minimize total execution cost subject to peak_live <= B and emission of all roots
  total_execution_cost: sum of selected e-node execution cost over every execution, including recomputation
  tie_break: lexicographic by emitted operation count, selected representative ids, then action sequence
  joint_oracle: exhaustive representative enumeration plus exact shortest-path state search over emitted-root mask and resident-value set
  small_instance_only: true

inputs:
  locked_suite_path: inputs/locked_instances.json
  controlled_generator:
    seed: 260809
    trial_ids: 0..399
    eclass_count: 5..8
    roots_per_instance: 1..2
    alternatives_per_nonleaf_eclass: 1..3
    child_arity: 1..2
    operation_cost: 1..9
    output_size: 1..8
    retain_policy: first 24 valid instances plus every witness until the first 8 witnesses, then stop
  public_artifact_projection:
    repository: https://github.com/egraphs-good/extraction-gym.git
    commit: 903ba0f818b50608fe20ae9e0f03c35cb27bc50a
    source_family_priority: [eggcc-bril, egg, rover]
    selector: >-
      Lexicographic first JSON instance whose deterministic reachable acyclic
      projection has 5..8 e-classes and at most 3 e-nodes per e-class.
    projection: preserve e-class/e-node/child/root structure and source node costs; assign unit output size to each non-leaf because the artifact carries no backend allocation sizes
    evidence_label: PUBLIC_NATURAL_STRUCTURE_WITH_SYNTHETIC_UNIT_SIZE_NOT_NATURAL_BACKEND_MEMORY
    download_limit: 5 MiB total; abort rather than enlarge

baselines:
  - id: RUNTIME_FIRST_THEN_EXACT_SCHEDULE
    selection: choose every extraction with globally minimum one-shot selected-DAG execution cost; ties remain eligible
    scheduling: exact fixed-DAG materialization/recomputation scheduler under the same B; report the best tied extraction
  - id: MEMORY_FIRST_SCHEDULING_AWARE_EXTRACTION_THEN_EXACT_SCHEDULE
    selection: >-
      choose every extraction with globally minimum recomputation-free peak-live
      over legal topological schedules; break/treat ties by minimum one-shot cost
      while retaining all exact ties
    scheduling: exact fixed-DAG materialization/recomputation scheduler under the same B; report the best tied extraction
  - id: JOINT_EXACT_ORACLE
    role: small-instance ceiling, not deployable baseline

mandatory_nonexecuted_subtractors:
  - Fast and Optimal Extraction for Sparse Equality Graphs (OOPSLA 2024; DOI 10.1145/3689801)
  - SmoothE: Differentiable E-Graph Extraction (ASPLOS 2025; DOI 10.1145/3669940.3707262)
  - e-boost: Boosted E-Graph Extraction with Adaptive Heuristics and Exact Solving (ICCAD 2025; arXiv 2508.13020)
  - Equality Saturation for Optimizing High-Level Julia IR (TACO 2026; DOI 10.1145/3795883)

metrics:
  mechanism:
    - selected_representatives
    - materialized_value_actions
    - delete_actions
    - recomputation_count
    - explored_schedule_states
    - feasible_extraction_count
  outcome:
    - peak_live
    - total_execution_cost
    - emitted_operation_count
    - selected_distinct_nonleaf_count
  full_cost:
    - input_lock_time_ms
    - representative_enumeration_time_ms
    - schedule_search_time_ms
    - peak_python_rss_bytes
    - output_json_bytes
  unavailable_in_stagea:
    - backend_machine_latency
    - spill_reload_cost
    - register_allocation_interaction
    - egraph_construction_cost_from_a_real_compiler

witness_definition: >-
  At the same locked instance and B, the joint oracle has strictly lower total
  execution cost than both sequential controls, with all three feasible and all
  object/allocation checks passing. A public-artifact projection witness is
  reported separately from controlled-generator witnesses.

counterexample_and_stop_rules:
  pass_signal: at least one exact controlled witness plus no oracle/cross-check failure
  stronger_signal: at least one public-artifact projection witness plus at least one controlled witness
  negative_kill_signal: no witness in all 400 controlled trials and every eligible public projection, with both sequential controls exact
  integrity_stop: any semantic, acyclicity, budget, cost-replay, determinism, or independent-oracle mismatch
  resource_stop: runtime over 15 minutes, process RSS over 2 GiB, or public download over 5 MiB
  interpretation: absence or presence in this bounded suite cannot establish the paper main claim

randomness:
  classification: deterministic_pseudorandom_input_generation
  seed: 260809
  repetitions: 2 identical full runs
  expected_reproduction: byte-identical canonical JSON results excluding recorded wall-clock and RSS fields

commands:
  prepare_public: >-
    git clone --depth 1 --filter=blob:none --sparse https://github.com/egraphs-good/extraction-gym.git vendor/extraction-gym;
    git -C vendor/extraction-gym checkout 903ba0f818b50608fe20ae9e0f03c35cb27bc50a;
    git -C vendor/extraction-gym sparse-checkout set data/eggcc-bril data/egg data/rover
  lock_inputs: py -3.12 lock_inputs.py --contract EXPERIMENT_CONTRACT.yaml --output inputs/locked_instances.json
  test: py -3.12 -m unittest -v test_probe.py
  run_1: py -3.12 probe.py --input inputs/locked_instances.json --output results/run1.json
  run_2: py -3.12 probe.py --input inputs/locked_instances.json --output results/run2.json
  validate: py -3.12 validate.py --run1 results/run1.json --run2 results/run2.json --output results/validation.json

success_criteria:
  command_exit_codes: all zero
  tests: all pass
  replay: exact metric and schedule replay match for every reported point
  reproducibility: canonicalized run1 and run2 SHA-256 equal
  claim_language: only NOT_FALSIFIED or PRELIMINARY_SUPPORT on positive result
