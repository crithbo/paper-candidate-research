reason: >-
  A causal boundary-only selection dry check showed that access-only ranks put
  all twelve selected objects into one 4KiB page in each of the first two
  reduced epochs. Such instances cannot exercise page packing and would make
  the registered killer vacuous. No candidate, baseline, objective, feasibility,
  or evaluation-epoch access result had been computed.
binding_selection_replacement: >-
  At each boundary, among live objects with footprint <= 2048 bytes and positive
  previous-epoch accesses, sort first by previous access count and SHA-256(key)
  and split into lower, middle, and upper access-count terciles. Within each
  tercile, sort by footprint then SHA-256(key), and select the objects at the
  four evenly spaced inclusive size ranks round(i*(m-1)/3), i=0..3. De-duplicate
  by key and fill any shortage by increasing SHA-256(key) within that tercile.
  This selects exactly twelve objects using boundary-available information only.
