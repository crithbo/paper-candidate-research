  - {path: resources/src/control/VHLO_A0_SCHEMA_CONTROL.py, class: KEEP_CAPSULE_REPRODUCIBILITY_MINIMUM, reason: exact nonclaim control}
  - {path: resources/build/control/manual-schema/result.json, class: KEEP_CAPSULE_REPRODUCIBILITY_MINIMUM, reason: schema PASS and binding gap evidence}
  - {path: STAGEA_EXECUTION_READINESS_LEDGER.yaml, class: KEEP_CAPSULE_REPRODUCIBILITY_MINIMUM, reason: topic cumulative A0 and correction budget}
