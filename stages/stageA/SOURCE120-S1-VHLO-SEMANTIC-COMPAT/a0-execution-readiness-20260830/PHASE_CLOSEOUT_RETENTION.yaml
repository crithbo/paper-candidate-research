  - {path: resources/downloads/commit-metadata, class: EPHEMERAL_DELETE_BEFORE_CLOSEOUT, expected_files: 0, expected_bytes: 0}
deletion_gate: MAINLINE_ACCEPTED_HANDOFF_PLUS_CONTAINMENT_REPARSE_ACTIVE_PROCESS_AND_RESUME_CHECKS
