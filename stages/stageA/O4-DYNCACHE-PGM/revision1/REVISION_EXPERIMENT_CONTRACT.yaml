    key_universe: integers 0 through 7 embedded into the unchanged ordered key
    initial_state: empty
    reachability: breadth-first closure of joint mechanism states under every insert and delete
    queries: predecessor -1 through 8 and every closed range over 0 through 7 at every reachable joint state
