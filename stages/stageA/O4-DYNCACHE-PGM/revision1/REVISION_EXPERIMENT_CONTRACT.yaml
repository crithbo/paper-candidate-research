decision_rules:
  PASS_RECOMMENDED_only_if:
    - exact semantics and cost accounting have zero failures
    - at least one pdec_unique_case_definition witness is reproduced in exhaustive or natural input
    - the witness supplies G1, G2, or M1 without an unpriced cost
    - original plus two independent deterministic replays match byte-for-byte
  STOP_RECOMMENDED_if:
    - the affine control frontier contains every PDEC transition and guarantee with the same cost vector
    - no bounded same-object PDEC-specific residual witness exists
  evidence_positive_ceiling: PRELIMINARY_SUPPORT
  forbidden_claim: MAIN_CLAIM_ESTABLISHED
  no_second_revision: true

negative_regions_to_report:
  - cases where certificate-triggered early splits increase page count or written bytes over plain COW
  - cases where the capacity-4 certified candidate window is not strictly smaller than a full leaf
  - natural stream regions with no effective delete evidence
  - any default-policy difference that the affine control best response absorbs

