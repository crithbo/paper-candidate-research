unchanged_object:
  structure: single-machine in-memory exact ordered-index leaf microkernel
  key: fixed-width lexicographic pair (uint32 Hilbert-cell, uint64 type-qualified OSM-element-id)
  predecessor: strict predecessor, max key strictly less than q
  range: exact closed range reporting in sorted order with output-sensitive leaf-chain traversal
  update_information: full sorted contents of the affected leaf plus the operation and key
  learned_semantics: a model may narrow local search but may never approximate the returned answer
  epsilon_rank: 1
  page_capacity_keys: 4
  page_payload_bytes: 256
  affine_metadata_bytes_per_page: 24
  atomic_publication: complete old page image remains visible until complete replacement images publish
  scope_limit: leaf-local only; no global directory, fence propagation, deferred multi-update credit, concurrency, or performance benchmark

same_action_repertoire:
  - keep one post-update page when capacity permits
  - replace one old page with one or more contiguous copy-on-write pages
  - choose any contiguous partition whose pages respect capacity
  - store or recompute the endpoint affine hint from the same leaf keys
  - use exact full-leaf fallback when an uncertified hint is retained

mechanisms:
  PLAIN_COW_BTREE_LEAF:
    persistent_metadata: none beyond ordinary leaf contents
    default_policy: keep one page until capacity overflow; then minimum-page balanced contiguous split
    query: exact binary search over the full selected leaf
  BTREE_LEAF_WITH_AFFINE_HINT:
    persistent_metadata: same 24-byte endpoint affine summary available to PDEC
    default_policy: capacity-only COW split; use hint when certified and exact full-leaf fallback otherwise
    absorption_frontier_policy: may take any same-repertoire split, including certificate-triggered early split, when asked to inherit a PDEC guarantee
    query: exact hint window plus exact fallback if needed
  PDEC:
    persistent_metadata: 24-byte endpoint affine certificate
    policy: minimum-page balanced contiguous split whenever capacity or epsilon certificate would be violated
    query: exact certified hint window without fallback

local_full_cost_vector:
  update_fields:
    - logical_route_page_touches
    - old_leaf_reads
    - new_leaf_writes
    - page_payload_bytes_written
    - affine_metadata_bytes_written
    - certificate_key_evaluations
    - rebuilt_key_slots
    - auxiliary_page_images
    - peak_auxiliary_bytes
  state_fields:
    - committed_leaf_pages
    - committed_payload_bytes
    - committed_affine_metadata_bytes
  query_fields:
    - model_evaluations
    - candidate_key_slots
    - exact_key_comparisons
    - full_leaf_fallbacks
    - leaf_pages_scanned_for_range
  no_weighted_composite_score: true
  fairness_rule: residual must survive vector comparison; an unreported metadata, fallback, split, or page cost invalidates it

predeclared_pdec_specific_guarantees_and_metrics:
  G1_CERTIFIED_NO_FALLBACK:
    statement: every committed page has endpoint-affine stored-key rank residual at most epsilon and local predecessor/range start never invokes full-leaf fallback
    useful_nonvacuity_requirement: yields a strict candidate-slot or comparison bound below the capacity-4 full-leaf bound on every frozen query
  G2_LOCAL_CAPS:
    statement: at most 4 charged logical page touches, 2 auxiliary pages, and 5 rebuilt key slots per effective update
    residual_requirement: at least one cap must be unavailable to both controls under the same COW action repertoire and full cost vector
  M1_FULLY_PRICED_FRONTIER:
    statement: at least one reachable or natural case places PDEC on a guarantee/cost point not reproduced or dominated by either control
    comparison: exact vector plus guarantee flags; no average-only or weighted-score win counts

absorption_test:
  affine_control_frontier: >-
    For every PDEC transition and query guarantee, ask whether BTREE_LEAF_WITH_AFFINE_HINT can
    take the identical contiguous COW partition using the identical stored summary and produce the
    identical guarantee and full cost vector. This guarantee-preserving best response is part of the
    control, not a third research mechanism.
  pdec_unique_case_definition: >-
    A reachable or natural case where PDEC's state/transition/guarantee/cost vector is not contained
    in the affine control frontier and is not inherited by PLAIN_COW_BTREE_LEAF.
  label_or_default_policy_difference_does_not_count: true

inputs:
