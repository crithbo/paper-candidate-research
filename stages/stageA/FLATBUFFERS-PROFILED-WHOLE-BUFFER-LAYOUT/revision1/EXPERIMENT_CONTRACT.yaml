exact_object:
  input: pinned TFLite schema plus identity-labelled rooted logical DAG, fixed values/nulls/presence, vector/key order, logical training profile and ordinary TFL3 framing
  output: one ordinary raw native FlatBuffers TFL3 buffer
  same_object_checks:
    - pinned unmodified tflite::VerifyModelBuffer accepts
    - pinned generated reader accepts
    - canonical schema/value/null/presence/vector/key/identity/alias digest equals the source
    - ordinary non-size-prefixed TFL3 identifier is unchanged
    - applicable native force-vector alignment holds
  forbidden:
    - schema, logical object, record/vector/key order or presence change
    - alternate reader, format, codec, compression, raw injection, emitter patch or postprocessor
    - Offset64 or size-prefixed TFLite output

frozen_inputs:
  corpus_manifest: ..\initial\inputs\natural_corpus_manifest.json
  corpus_manifest_sha256: 6C8F68ADA4DEF9D0C8751C2FA889A68C49C47BD4E7DC3D3593A34F87799BE757
  models: 24
  split: 11_train__13_heldout_by_family
