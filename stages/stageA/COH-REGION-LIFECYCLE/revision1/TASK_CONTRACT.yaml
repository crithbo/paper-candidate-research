atomic_revision_gate: SOURCE_BOUNDED_SAME_INFORMATION_SELECTOR_RESIDUAL
research_question: >-
  Under the unchanged program structures and analytical action-cost functions,
  does the current candidate retain any strictly positive full-cost residual over
  a deployable simple selector using exactly the same pre-phase information?

same_information_selector:
  information: region tuple plus the same coefficient tuple available to the candidate
  action: independently evaluate B0 through B3 and choose deterministic minimum per region
  tie_break: lexical action id
  extraction_and_decision_cost: identical to the candidate planner cost
  deployability_scope: finite four-action per-region rule; no future information

coefficient_policy:
  file: SOURCE_BOUNDED_DOMAIN.json
  arbitrary_original_grid_for_platform_claims: forbidden
  primary_source_measured_transfer_rates: retained as descriptive bounds only
  unmeasured_allocation_fault_pte_overlap_planner_terms: unidentified
  proof_domain: all finite nonnegative shared cost completions consistent with the frozen semantics
  reason: selector/candidate identity is coefficient-independent; no hardware calibration is needed to decide absorption

full_cost_boundary:
  shared_action_costs: inherited unchanged from PROBE_SCRIPT.py
  candidate_extra_cost: inherited planner_overhead_fraction times program bytes
  selector_extra_cost: same extraction and decision cost as candidate
  excluded_from_result_claim: elapsed time, speedup, energy, measured PTE/fault/migration/C2C

decision_rules:
  PASS_RECOMMENDED: strict positive candidate-only residual survives selector after full cost
  STOP_RECOMMENDED: selector reproduces all candidate actions and costs with strict residual count zero
  RESERVE_RECOMMENDED: only actual GH200 B0-B3 measurement can decide the proposition
  positive_ceiling: PRELIMINARY_SUPPORT_OR_NOT_FALSIFIED

