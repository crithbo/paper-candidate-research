schema: preclaim-contract-fidelity-report-v1
assignment_id: NONBLIND-STAGEA-20260826-PGM-INDEX-F0
mode: NONBLIND_STAGEA_COMPATIBILITY
contract_sha256: 150F912470CBD2AA862260D5DB33769770ADF116E267665A26D3C47D75204572
author_artifact_acceptance: {path: A11_MAINLINE_PRECLAIM_ACCEPTANCE.yaml, decision: AUTHOR_ARTIFACT_WINDOWS_COMPATIBLE_EXAMPLE_PRECLAIM_PASS__NO_SCIENTIFIC_INFERENCE}
evidence_ceiling: PRECLAIM_CONTRACT_FIDELITY_ONLY__NO_NATURAL_OR_SCIENTIFIC_CLAIM
execution_performed: false

deterministic_input_contract:
  key_type: uint64
  cardinality: 1000000
  generator: SplitMix64(seed=0x2026082700010001) applied exactly cardinality times, then unsigned_sort_and_deduplicate; regenerate until cardinality unique values is reached using successive generator outputs
  stored_input_identity: FUTURE_GENERATED_INPUT__SEED_AND_ALGORITHM_FROZEN__NO_RUN_YET
  query_set: 100000 deterministic present keys at ranks floor(i*999999/99999), plus 100000 deterministic absent keys generated by SplitMix64(seed=0x2026082700020001) and rejected if present
  lookup_semantics: lower_bound_in_sorted_uint64_keys; present lookup must return exact rank and absent lookup must return insertion rank

comparator_contract:
  name: exact_binary_search_over_same_sorted_key_array
  construction: none beyond the shared sorted key array
  lookup: lower_bound over full [0,N) interval using identical query set and uint64 comparison
  equality: comparator and PGM path must both report the same lower_bound rank; no approximate-hit substitution

pgm_construction_contract:
  epsilon_grid: [4, 16, 64, 256]
  construction_budget: one fresh PGM build per epsilon over the same sorted key array; no post-result epsilon selection, no additional tuning builds
  query_budget: each epsilon consumes exactly the frozen 200000-query mixed set once in the future preclaim execution
  parameter_search_cost: four construction attempts and four query batches are part of full cost, not excluded

metric_denominators:
  lookup_latency: total elapsed lookup time / 200000 queries, reported separately for present and absent subsets
  space: index bytes plus shared key-array bytes; binary comparator reports key-array bytes and PGM reports key-array plus index bytes
  error: exact lower_bound rank disagreement count / 200000; required value is zero for any future accepted fidelity execution
  construction_cost: elapsed construction time and peak process RSS per epsilon, with four-build parameter-search aggregate reported separately
  parameter_search: sum of construction time, query time, peak RSS maximum, and bytes across all four epsilon candidates

full_cost_schema:
  compile: portable CMake/Ninja command duration, compiler version, build outputs and peak RSS
  construct: per-epsilon elapsed time, peak RSS, index bytes, shared-key-array bytes
  query: per-batch elapsed time, query count, present/absent split, returned-rank checksum
  memory: peak RSS during construction and query, index bytes, key bytes, executable/runtime overhead labeled separately
  parameter_search: all four epsilon builds and all four frozen query batches
  excluded_costs: []

legality_witness_contract:
  keys: [3, 8, 15, 22, 31, 47, 60, 88]
  epsilon: 2
  queries_and_required_lower_bound: {3: 0, 7: 1, 15: 2, 16: 3, 88: 7, 99: 8}
  required_PGM_interface_semantics: search(query) returns a clipped half-open candidate range [lo,hi) within [0,8] containing the required lower_bound rank
  final_action: exact_binary_search_only_within_returned_range; resulting rank must equal required_lower_bound
  fail_closed_conditions: [range_outside_key_bounds, empty_range_for_valid_query, required_rank_not_in_range, final_rank_mismatch, non_uint64_ordering]
  witness_execution_status: NOT_RUN__CONTRACT_ONLY

forbidden_until_mainline_fidelity_acceptance: [natural_probe, performance_claim, baseline_comparison, scientific_inference, production_state_change, stageB]
owner_disposition: CONTRACT_COMPLETE__WAIT_FOR_MAINLINE_ACCEPTED_PRECLAIM_CONTRACT_FIDELITY_GATE
