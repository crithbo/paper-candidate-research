    record_count: UINT64_LITTLE_ENDIAN
    per_record_header: TWO_UINT32_LITTLE_ENDIAN_KEY_LEN_VALUE_LEN
    payload: KEY_BYTES_THEN_VALUE_BYTES
    validation: [nonempty, exact_record_count, exact_file_consumption_no_trailing_bytes, key_lengths_and_value_lengths_in_bounds, keys_strictly_increasing_and_unique, frozen_manifest_sha256_match]
  input_use: REPLACE_ONLY_FIXED_MAKEWITNESS_WITH_EXACT_PARSED_MANIFEST_RECORDS
  rocksdb_options_methods_candidate_and_reader_protocol: IDENTICAL_TO_FROZEN_PRECLAIM_HARNESS_AND_EXPERIMENT_CONTRACT
