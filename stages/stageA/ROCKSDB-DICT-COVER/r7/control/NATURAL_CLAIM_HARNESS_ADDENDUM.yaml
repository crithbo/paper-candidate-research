    schema_version: rocksdict-stagea-claim-result-v1
    run_class: CLAIM_BEARING_NATURAL
    natural_manifest_used: true
    claim_bearing: true
    required_identity_fields: [manifest_id, manifest_sha256, record_count, logical_key_bytes, logical_value_bytes, mode, cell, replay, run_id]
    required_validity_fields: [pass, sst_file_writer_used, stock_block_based_table, table_creation_reason_compaction, bottommost_level, live_sst_count, live_sst_level, checksums, full_scan_equality, point_equality, range_equality]
