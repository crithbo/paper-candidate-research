  write_directory: <LEGACY_LOCAL_PROJECT_ROOT>\stages\stageA\ROCKSDB-DICT-COVER
  exact_object: >-
    One production-equivalent bottommost-compaction standard BlockBasedTable SST
    from one frozen sorted KV manifest. Each manifest is an independent exact
    object instance. SstFileWriter is excluded from claim-bearing execution.
  allowed_candidate_action: >-
    Finite-train-byte deterministic single-pass bounded-memory pre-trainer
    retained-fragment coreset followed by the unchanged pinned Zstd
    ZDICT_trainFromBuffer/FastCover trainer.
  prohibited_actions:
    - seed_scan
    - order_scan
    - prefix_scan
    - stratum_scan
    - trainer_parameter_scan
    - selector_or_policy_wrapper
    - codec_or_decoder_change
    - record_reordering
    - cross_sst_dictionary
    - external_sst_fixture_substitution
  mechanism_pivot_authorized: false

