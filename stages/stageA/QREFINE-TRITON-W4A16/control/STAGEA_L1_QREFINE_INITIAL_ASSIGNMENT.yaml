  - no_finite_composition_route
  - grammar_admits_only_scalar_schedule
  - current_system_proves_the_full_frozen_relation_on_both_targets_with_only_routine_adaptation

allowed_actions:
  - Read the frozen inputs and the Stage A owner rules/templates.
  - Retrieve official/public exact source archives, source files, wheels, solver binaries, papers, and metadata inside resource_root within the envelope.
  - Create an assignment-local isolated environment, build or run small source/solver tooling, capture frozen MLIR, run fidelity checks, the 12 mutants, and bounded CPU proof/counterexample work after the gate passes.
  - Probe existing local hardware/toolchain read-only. Run a target performance witness only on an exact accessible sm89 or gfx1100 device and only after the fidelity gate passes.
  - Stop early and package a precise resource blocker before exceeding any envelope or requiring system/global changes.

forbidden_actions:
