preclaim_contract_fidelity_gate:
  - Prove that observer-only capture and serialization at the frozen boundary do not change the MLIR module, pass pipeline, options, target attributes, or subsequent conversion. Require pre/post structural hash, operation inventory, round-trip audit, and a small identity witness.
  - Freeze the exact solver implementation, version, binary hash, command line, rounding/IEEE support, timeout, and proof/counterexample replay route before any claim-bearing mutant result. Solver may be Z3 or cvc5, but only one primary identity may carry the claim.
  - Map every frozen TCB operation to modeled, rejected, metadata-only, or semantic-critical-unsupported. Semantic-critical uninterpreted operations allowed: zero.
  - Reproduce or authoritatively check the strongest native/current baselines: Triton verifier/tests, FpSan, pointer-safety verifier scope, Wang-style MLIR translation validation, and verified lifting of Triton operators. Controls that change the endpoint remain non-claim-bearing.
  - Freeze all full-cost units and collection paths: capture, normalization, obligation construction, solver CPU/RSS/wall, proof bytes, compiler CPU/RSS/temp/output bytes, and any later legal-schedule performance witness.
  - Do not start a claim-bearing mutant run until every predicate above passes. A preclaim resource/tool failure is a blocker, not a scientific STOP.

stagea_objective:
  - Materialize one exact small frozen operator instance for each target at the accepted boundary without changing the object.
  - Build the restricted mixed bit-vector/IEEE operational interpreter and the smallest compositional obligation route for the fixed reduction tree.
  - Execute exactly the 12 pre-registered mutant classes from probe_72h.md only after the fidelity gate passes; record accepted, rejected, unsupported, and smallest localized counterexample.
  - Demonstrate finite row/tile-to-output composition on one small symbolic shape.
  - Attempt one grammar-admitted non-scalar schedule per target only when an accessible matching target exists. Absence of either GPU is a resource blocker for the performance witness and cannot scientifically reject the validator.
  - Update the collision and Q1/Q2 gap review and report an auditable AI core fraction.

decisive_killers:
