formalization:
  state: "(S, o, g), where S is a connected relation subset, o is the current output order, and g is the exact accumulated join+sort cost"
  omega_condition_exists_only: "at a valid edge cut, first(o_left) != first(o_right), hence the cut-side input requires a full sort"
  omega_condition_with_forall: "the common prefix at a valid edge cut is exactly the fixed all-join attribute prefix A_forall^R"
  future_demand_set: "D_S contains every permutation of every nonempty cross-cut join-key set between S and an adjacent disjoint connected U; for S=R it contains Omega when Omega is nonempty"
  candidate_signature: "Sigma_S(o) is the vector indexed by D_S of (longest-common-prefix(o,d), exact uniform-segment sort-cost(S,o,d))"
  naive_signature_under_attack: "longest-common-prefix(o,Omega) only"
  future_equivalence_obligation: "same S and same candidate signature imply identical incremental cost for every legal first continuation action; because that action overwrites the merge output order with d, all later costs are then identical"
  candidate_bound: "h=max(h_join,h_sort), where h_join is the exact order-free join-only completion cost and h_sort is the minimum unavoidable next-input/final-Omega sort cost"
  admissibility_obligation: "for every enumerated reachable (S,o), h <= exact minimum remaining join+sort completion cost"

inputs:
  exhaustive_family:
    relation_counts: [3, 4]
    relation_labels: [R0, R1, R2, R3]
    join_attribute_alphabet: [A, B]
    edge_key_choices:
      - [A]
      - [B]
      - [A, B]
    graph_scope: every_connected_labeled_simple_graph
    edge_label_scope: every_assignment_of_a_nonempty_key_choice_to_each_edge
    final_orders:
      - []
      - [A]
      - [B]
      - [A, B]
      - [B, A]
    cardinality_profile: "card(S)=32+7*mask(S)+3*|S|, deterministic and frozen"
    ndv_profile: "ndv(S,A)=min(card(S),2+mask(S)%5); ndv(S,B)=min(card(S),3+(mask(S)*2)%7)"
    expected_instance_count: 19440
  natural_structure_probe:
