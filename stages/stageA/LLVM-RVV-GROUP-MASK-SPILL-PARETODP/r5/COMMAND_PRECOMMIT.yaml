  - {id: R3_1, argv: [resources/env/rvv-toolchain/bin/llc.exe, -mtriple=riscv64, -mattr=+v, -run-pass=greedy, -verify-machineinstrs, resources/src/harness/forced-pressure.mir, -o, resources/logs/r5/replay-R1.mir]}
  - {id: R3_2, argv: [resources/env/rvv-toolchain/bin/llc.exe, -mtriple=riscv64, -mattr=+v, -run-pass=greedy, -verify-machineinstrs, resources/src/harness/forced-pressure.mir, -o, resources/logs/r5/replay-R2.mir]}
  - {id: R4, argv: [bundled_python, resources/src/split_closure/split_closure.py, check, --mir, resources/logs/r5/replay-R1.mir, --replay2, resources/logs/r5/replay-R2.mir, --output, resources/logs/r5/split_closure.json]}
