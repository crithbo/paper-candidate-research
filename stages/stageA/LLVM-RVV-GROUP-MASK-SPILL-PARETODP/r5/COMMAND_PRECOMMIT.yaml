  - {id: R6, argv: [bundled_python, resources/src/harness/rvv_preclaim.py, f4, --output, resources/logs/r5/f4.json]}
  - {id: R7, argv: [bundled_python, resources/src/harness/rvv_preclaim.py, f5, --output, resources/logs/r5/f5.json]}
