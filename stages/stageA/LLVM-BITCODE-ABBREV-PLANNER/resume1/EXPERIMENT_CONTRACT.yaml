  name: WIDTH_LADDER_SHARED_LOCAL_DYNAMIC_PROGRAM
  short_name: WL-SLDP
  novelty_route: N2
  grammar_constructor: literal-code plus deterministic Fixed VBR Array Char6 Blob operands from unchanged records
  scope_actions:
    - reuse existing BLOCKINFO grammar
    - new immediate local grammar
    - capacity-neutral final-VST local-to-BLOCKINFO move under exact offset safety
  legal_order: first matching record then canonical grammar key; all definitions precede their use
  assignment_solver: exact dynamic program over record index and bit residue modulo 32
