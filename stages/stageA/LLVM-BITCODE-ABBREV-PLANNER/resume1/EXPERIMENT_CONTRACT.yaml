    - canonical decoded IR equality after removing only filename-derived ModuleID
    - opt -passes=verify succeeds
    - expanded semantic block/record values and order are exactly identical
  allowed_changes:
    - legal abbreviation grammar
    - legal BLOCKINFO or immediate-block scope and definition order
    - induced application abbreviation IDs and fixed per-block CodeLen
    - unchanged-record assignment or native UNABBREV fallback
  forbidden_changes:
    - any IR or expanded record change reorder omission split merge
    - patching VSTOFFSET FNENTRY or another record value
    - module split merge
    - alternative codec nonnative reader external compression primary target
