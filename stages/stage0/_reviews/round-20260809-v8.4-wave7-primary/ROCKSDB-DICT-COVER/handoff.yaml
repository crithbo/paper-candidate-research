provenance_correction: >-
  The historical BlockBasedTable wiki random-64-byte sampling description is
  stale for current main. Current BlockBasedTableBuilder uses a deterministic
  midpoint/prime-stride traversal over buffered blocks up to max_sample_bytes.
exact_object: >-
  One production-equivalent bottommost-compaction standard RocksDB
  BlockBasedTable SST from one fixed sorted KV manifest, with unchanged order,
  KV bytes, comparator, block/table format, dictionary scope, decoder,
  checksum/read semantics, block size, Zstd level and byte budgets.
residual_kernel: >-
  A deterministic bounded online retained-fragment coreset under the current
  per-SST buffering and trainer-input byte contract, followed by the unchanged
  pinned Zstd FastCover trainer. Coverage-based final dictionary construction
  itself is absorbed by FastCover and Liao et al. WWW 2016.
strongest_fair_baselines:
  - no dictionary
  - current RocksDB raw dictionary mode
  - current RocksDB trained mode with midpoint/prime-stride block sampling
  - first-prefix and seeded uniform byte/block reservoir
  - deterministic key-range-stratified reservoir
  - preregistered finite legal settings grid under identical semantics and full cost
  - tiny exact maximum-coverage oracle as ceiling only
stageA_killer:
  premise: >-
    Under an identical sample-byte cap, natural structured SSTs contain useful
    fragments omitted by the complete current/simple union, and the bounded
    coreset retains them cheaply enough to affect the unchanged trainer and the
    end-to-end SST Pareto frontier.
  stop_if:
    - useful retained-action coverage outside the complete seeded union is below 10 percent
    - any reader, checksum, full-scan, point or range equality check fails
    - no p50 and p90 full-cost Pareto point survives every finite-union member
    - sketch, replacement or training overhead consumes the apparent benefit
    - benefit requires changing object, order, block size, level, trainer, byte budget or cache policy after outcomes
  positive_ceiling: PRELIMINARY_SUPPORT_ONLY
current_source_findings:
  - current builder uses deterministic prime-stride block sampling, not the historical random-64-byte scheme
  - Zstd FastCover already performs d-mer-frequency coverage and redundancy removal
  - WWW 2016 Liao et al. is the coverage-method genealogy and a major subtractor
  - no exact one-SST bounded pre-trainer coreset plus full-cost direct fatal was found
required_confirmation_attacks:
  - validate current-source provenance correction and pin target commits
  - test bottommost-compaction versus SstFileWriter object parity
  - challenge whether pre-trainer coreset is non-product beyond FastCover/current sampling
  - validate the finite-union and p50/p90 full-cost killer
