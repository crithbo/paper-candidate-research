cutoff_date: 2010-11-24
contribution_type: METHOD_ALGORITHM
exact_object: lossless compression of natural web and social graphs through node ordering
natural_scenario: large sparse graphs whose adjacency lists exhibit community and reference locality
problem: generic lexical or traversal orders expose only one locality scale and leave compression opportunities unused
atomic_action: perform label propagation at multiple resolutions and concatenate the resulting nested communities into an order
mechanism: multiresolution structural locality increases adjacency-list reference reuse and shortens residual gaps
information_condition: graph adjacency only; no coordinates or target compression result
comparators: [lexical_order, breadth_first_order, earlier_graph_specific_ordering]
claim_endpoint: compressed bits per link and access cost after charging ordering time and memory
full_cost: [ordering_time, ordering_memory, compression_time, bits_per_link, random_access_time]
minimum_falsifier: no compression improvement over strong orders after ordering and access costs
