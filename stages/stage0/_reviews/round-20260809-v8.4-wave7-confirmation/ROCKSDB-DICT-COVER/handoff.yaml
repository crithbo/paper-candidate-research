baseline_union_rule: >-
  Compare every applicable, individually realizable same-information member:
  no-dict; RocksDB raw; current trained midpoint/prime-stride; prefix; seeded
  byte/block reservoir; deterministic key-range stratified; and the frozen legal
  finite grid. Do not construct an incompatible fictional super-baseline.
