strongest_counterargument: >-
  Current RocksDB already performs bounded deterministic sample selection and
  FastCover already performs coverage-aware dictionary construction. If the
  candidate is only a seed, order, prefix, stratum, parameter sweep, or retained
  byte difference erased by the trainer, the N2 is fully absorbed.
exact_object: >-
  One production-equivalent bottommost-compaction standard BlockBasedTable SST
  from one frozen sorted key-value manifest, with all build, format, compression,
  dictionary, buffer, block, cache, creation-reason, level, and bottommost context
  frozen inside each comparison cell.
