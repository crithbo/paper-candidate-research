single_revision_gate:
  id: NATIVE_SDK_COUPLED_BRANCH_TRANSITION__NONPRODUCT_MARGINAL_CORRECTNESS_AND_CONSERVATIVE_FRONTIER_CERTIFICATE
  conjuncts:
    C1_native_transition_induction:
      - define one complete frozen SDK transition from processed model distribution through action event, tool execution, observation event, workspace/process effects, context update and terminal state
      - state an induction invariant showing both arms retain their correct native marginals at every comparable transition
      - include native fork() and rerun_actions() in the current union
    C2_isolation_catalog:
      - enumerate deep-copied, shared, copy-on-branch, reset, forbidden-to-share and unobservable state
      - include agent, events, agent_state, context, workspace/filesystem, processes, tools, tests, RNG, clocks/network and evaluator state
      - treat non-idempotent tool replay as a first-class failure condition, not an implementation detail
    C3_sampling_marginals:
      - define shared-Gumbel coupling only after the exact processors, warpers and stopping controls
      - prove categorical marginal equivalence for each arm under the frozen sampling route
      - explicitly disclaim bitwise equivalence to native RNG execution
    C4_split_fallback_and_uncomparable:
      - specify keep-shared, split-noise, independent-fallback, abort-pair and uncomparable transitions
      - prove fallback preserves marginal validity and prevents cross-arm/evaluator leakage
    C5_nonproduct_frontier:
      - state a target-specific guarantee that is not CAR plus token coupling plus generic paired mean
      - include full two-branch inference, coupling, isolation/reset, failed/uncomparable pair and evaluator cost
      - define a conservative simultaneous benefit frontier or sample-complexity/variance condition with explicit no-benefit region
  failure_sentinels:
    - DIRECT_CURRENT_UNION_ABSORPTION
    - GENERIC_TOKEN_COUPLING_OR_PAIRED_STATISTICS_ONLY
    - INVALID_CATEGORICAL_MARGINAL_OR_NATIVE_RNG_EQUIVALENCE_OVERCLAIM
    - NONISOLATED_OR_NONIDEMPOTENT_TOOL_STATE_WITHOUT_CONSERVATIVE_FALLBACK
    - OPEN_ENDED_ENGINEERING_PROGRAM_NOT_ONE_STATIC_CERTIFICATE

