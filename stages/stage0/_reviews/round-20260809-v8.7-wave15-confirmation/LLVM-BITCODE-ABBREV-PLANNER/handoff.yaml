confirmed_residual:
  id: GLOBAL_COSTED_NATIVE_ABBREVIATION_GRAMMAR_SCOPE_ASSIGNMENT_PLANNER
  novelty_status: SEARCH_BOUNDED_OPEN
  proposition: >-
    For a pinned LLVM Module and frozen expanded semantic block-record trace,
    construct a legal native abbreviation grammar, definition scope and order,
    unchanged-record assignment, and fallback plan that jointly accounts for
    definition amortization and stepwise abbreviation-ID/code-width costs,
    while producing ordinary raw bitcode accepted by the pinned native reader.
  non_product_requirement: >-
    N2 requires a named global algorithm or formal guarantee coupling grammar
    construction, shared/local scope, definition order, record coverage and
    assignment, and ID-width steps. Schema patches, unused-template deletion,
    flag sweeps, emitter patches, postprocessors, opaque solvers, and local byte
    heuristics are insufficient.

exact_object:
  input: pinned_LLVM_Module_and_frozen_expanded_semantic_block_record_trace
  output: one_ordinary_raw_native_LLVM_bitcode_file
  invariants:
    - pinned_unmodified_native_reader_accepts_output
    - canonical_decoded_IR_is_equal
    - native_opt_verify_passes
    - expanded_semantic_record_values_and_order_are_identical
  permitted_actions:
    - legal_abbreviation_grammar_construction
    - legal_BLOCKINFO_or_immediate_block_definition_scope_and_order
    - induced_abbreviation_ID_and_code_width
    - unchanged_record_assignment_to_legal_abbreviation_or_UNABBREV_RECORD
  forbidden_drift:
    - IR_or_semantic_record_change
    - record_reorder_omission_split_or_merge
    - module_split_or_merge
    - alternative_codec_or_non_native_reader
    - external_compression_as_primary_objective

