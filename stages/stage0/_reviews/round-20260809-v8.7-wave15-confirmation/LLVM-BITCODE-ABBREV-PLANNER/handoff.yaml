  native_LLVM_decode_overlap: true
  raw_native_abbreviation_baseline: false
  reason: >-
    BCDB rewrites LLVM-decodable bitstreams for downstream database/external
    compression and deliberately enlarges uncompressed bitcode; it subtracts
    generic re-encoding/compression claims but does not replace B0-B2 for the
    frozen raw-native abbreviation-only objective.
  escalation_rule: >-
    If a future claim includes external compression or changes the storage
    pipeline, BCDB becomes a direct fair baseline and same-object review must
    be reopened.

