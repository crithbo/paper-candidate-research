schema: ort-stage0-q2-breadth-baselines-v1
assignment_id: STAGE0-REVISION1-20260830-ORT-EP-ASSIGNMENT-STABILITY
topic_id: SOURCE122-S1-ORT-EP-ASSIGNMENT-STABILITY

minimum_q2_breadth:
  public_models_min: 12
  model_families_min: 3
  relation_families_required: 4
  relation_family_names:
    - ONNX_Function_expansion_or_inlining
    - inverse_Transpose_or_Reshape_identity
    - Split_then_Concat_reconstruction
    - constrained_Gemm_to_MatMul_plus_Add
  heldout_models: mandatory
  heldout_relations: mandatory
  second_release_or_same_version_public_EP_route: mandatory
  primary_stack_remains: onnxruntime_gpu_1_26_0__CUDAExecutionProvider_then_CPUExecutionProvider
  external_validity_stratum_separate_from_primary_denominator: true

result_independent_freeze:
  model_identity_and_family_before_any_future_run: required
  source_representation_before_any_future_run: required
  relation_instances_before_any_future_run: required
  holdout_split_before_any_future_run: required
  output_quality_threshold_before_any_future_run: required
  repetition_count_and_failure_penalty_before_any_future_run: required
  failed_or_neutral_cell_backfill: forbidden

strongest_baselines:
  OUTPUT_ONLY_DIFFERENTIAL:
    information: paired_outputs_only
    role: determine_whether_assignment_features_add_value_beyond_semantic_output_checks
  RAW_TIMING:
    information: source_representation_action_timing_and_full_cost_without_assignment_lineage_features
    role: strongest_simple_performance_proxy
  SIMPLE_STRUCTURE:
    information: static_graph_node_op_edge_and_relation_descriptors_without_runtime_assignment_lineage
    role: strongest_simple_structural_proxy
  NATIVE_ASSIGNMENT_INFO:
    information: public_ORT_assignment_subgraph_node_and_profile_surfaces
    role: current_first_party_feature_baseline
  FULL_PER_REPRESENTATION_OPTIMIZER_GRID:
    information: BASIC_EXTENDED_ALL_for_each_representation
    role: offline_oracle_and_regret_reference_only
    not_available_to_source_only_online_decision: true
  VERSION_COMPATIBLE_MOBIUS_QNN_LINEAGE:
    information: strongest_public_version_compatible_EP_aware_rewrite_trace_and_source_to_backend_lineage_features
    role: strongest_lineage_feature_baseline
    private_QNN_or_private_hardware_required: false
    unavailable_public_component_policy: report_unavailable_and_do_not_replace_with_private_evidence

fairness_contract:
  same_model_variants_actions_provider_order_provider_options_and_process_controls: required
  same_output_quality_threshold_and_failure_penalty: required
  baseline_overhead_charged_to_full_cost: true
  offline_oracle_never_presented_as_deployable_online_baseline: true
  incompatible_versions_not_combined_in_one_ranking_denominator: true
  tuning_or_threshold_search_after_results: forbidden
  output_timing_structure_and_assignment_feature_ablation: mandatory

q2_failure_conditions:
  - fewer_than_12_public_models_or_3_model_families
  - any_of_four_relation_families_missing
  - no_heldout_models_or_no_heldout_relations
  - no_separate_second_release_or_same_version_public_EP_external_validity_stratum
  - assignment_features_do_not_outperform_raw_timing_or_simple_structure_for_the_frozen_decision_endpoint
  - all_surviving_effects_reduce_to_existing_profiler_mutation_or_generic_testing_work

