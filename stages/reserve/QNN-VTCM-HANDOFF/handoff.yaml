topic_id: QNN-VTCM-HANDOFF
source_stage: STAGE0
proposed_next_stage: HUMAN_RESEARCH_RESERVE
decision: RESERVE_RECOMMENDED
exact_object: >-
  Black-box admission/dispatch across actually compatible, pre-generated QNN EP HTP
  context/session configuration portfolios for two or more concurrently arriving sessions
  of one fixed-shape, fully HTP-supported QDQ ONNX model on one locked Qualcomm device.
  Static VTCM/shared-memory/spill-fill features are portfolio attributes; only documented
  run options may vary per inference.
main_claim: >-
  A profile-conditioned admission/dispatch policy may improve tail latency or measured
  isolation debt over the strongest fixed and myopic joint portfolios only after complete
  context, cache, RPC, copy, synchronization, warmup, CPU/fallback, and recovery costs
  are charged. No online VTCM lease-transfer, spill command, or opaque allocator claim.
academic_value_score: 54
ai_executability_score: 10
ai_executability_class: AI_AUXILIARY_ONLY
ai_core_fraction: 0.35
strongest_baseline: >-
  Native default; each verified legal individual static option; every actually compatible
  static union; same-portfolio MYOPIC-JOINT and PRIORITY-ONLY policies; and a same-action,
  same-ledger trace-clairvoyant JOINT-ORACLE upper bound. Native backup sharing and static
  spill/fill are mandatory deployment baselines, not contributions.
decisive_evidence: >-
  On a locked authorized HTP device/model/natural trace, a held-out replay must retain
  frozen semantics, show a pre-registered measured-cost configuration reversal, and improve
  p99 or declared isolation debt over both JOINT-STATIC and MYOPIC-JOINT without violating
  a declared SLO. A CPU/reference or analytical replay alone cannot establish this claim.
unresolved_risks:
  - Public QNN EP documents no online VTCM lease/release, residency, per-request spill/fill, or isolation-control API.
  - All static portfolio combinations must be generated and tested as compatible; a full union cannot be assumed legal.
  - Native sharing and spill/fill may eliminate the residual; no natural multi-session HTP headroom has been measured.
  - CPU backend/reference and unsupported-op CPU fallback have different semantics and must not be silently mixed.
  - Current search is collision-first and SEARCH_BOUNDED_OPEN, not novelty closure.
next_killer_gate: >-
  User-authorized device-only Stage A gate: execute the locked held-out multi-session
  replay against complete compatible static and myopic baselines, with CSV/optrace plus
  host-side complete ledger; stop if no non-dominated action reversal remains.
mechanism_pivot_remaining: 0
reserve_reason: >-
  Academic gate passes provisionally, but the central evidence requires concurrent real
  HTP sessions and black-box device observations that AI/local CPU paths cannot obtain.
  Commodity-device absence is a reserve condition, not an academic STOP.
evidence_ceiling: >-
  Official documentation, public source/PR audit, and potential CPU/reference semantic
  checks only. No HTP timing, contention, copy/RPC, warmup, fallback, energy, or hardware
  result exists.
execution_authority: >-
  No Stage A/B or device experiment is authorized by this handoff. Mainline/user must
  decide whether to move this candidate to HUMAN_RESEARCH_RESERVE and separately authorize
  any device, SDK, hosted-service, or natural-trace use.
