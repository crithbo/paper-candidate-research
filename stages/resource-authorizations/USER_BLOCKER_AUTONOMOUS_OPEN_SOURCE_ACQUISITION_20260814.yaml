schema: user-resource-authority-v1
authorization_id: USER_BLOCKER_AUTONOMOUS_OPEN_SOURCE_ACQUISITION_20260814
issued_at: 2026-08-14
policy_authority: USER
purpose: >-
  允许已经因资料、源码、数据、工具链或可复现环境不足而阻塞的
  Discovery、Stage 0 与 Stage A 工作，自主获取公开或开源材料，并在
  隔离目录内做完成原冻结合同所必需的构建、转换、静态检查与重放。
applies_to:
  - REGISTERED_BLOCKED_USER_ACTION_REQUIRED_ASSIGNMENTS
  - FUTURE_RESOURCE_BLOCKERS_CREATED_WHILE_CONTINUOUS_DISCOVERY_IS_ACTIVE
allowed:
  - PUBLIC_FIRST_PARTY_DOCUMENTATION_AND_SOURCE
  - OPEN_SOURCE_RELEASE_ARCHIVES_AND_PORTABLE_TOOLCHAINS
  - PUBLIC_PAPERS_DATASETS_TRACES_AND_BENCHMARK_ARTIFACTS
  - OFFICIAL_OR_PROVENANCE_VERIFIABLE_CHECKSUMS_SIGNATURES_AND_BUILD_METADATA
  - ISOLATED_SOURCE_BUILD_AND_NON_CLAIM_SMOKE_NEEDED_FOR_THE_FROZEN_GATE
  - SAME_CONTRACT_RESUME_IN_A_NEW_IMMUTABLE_SUBDIRECTORY
conditions:
  - EACH_ASSIGNMENT_MUST_FREEZE_URLS_OR_SELECTION_RULES_BUDGETS_ATTEMPTS_AND_WRITE_ROOT
  - RECORD_ACTUAL_BYTES_HASHES_LICENSE_PROVENANCE_COMMANDS_AND_COST
  - PREFER_PORTABLE_PROCESS_LOCAL_ENVIRONMENTS
  - PRESERVE_OLD_BLOCKER_AND_FAILURE_DIRECTORIES_UNCHANGED
  - RESOURCE_FAILURE_HAS_NO_SCIENTIFIC_INFERENCE
  - CLAIM_BEARING_RUNS_START_ONLY_AFTER_PRECLAIM_FIDELITY_GATE
forbidden:
  - PRIVATE_OR_UNLICENSED_MATERIAL
  - CREDENTIAL_LICENSE_OR_ACCESS_CONTROL_BYPASS
  - EXTERNAL_HUMAN_COMMUNICATION_OR_ACCOUNT_CREATION
  - SYSTEM_WIDE_INSTALL_OR_GLOBAL_PATH_MUTATION_WITHOUT_A_SEPARATE_EXPLICIT_SCOPE
  - CHANGING_TOPIC_OBJECT_COMMIT_SEMANTICS_COMPARATOR_OR_SCIENTIFIC_GATE
  - REVIVING_STOP_OR_USING_A_SECOND_SCIENTIFIC_REVISION
  - AUTOMATIC_STAGE_B_OR_FORMAL_PROJECT_ACTIVATION
  - NETWORK_SECURITY_VULNERABILITY_ATTACK_EXPLOIT_OR_PROTOCOL_SECURITY_TOPICS
  - UNBOUNDED_RETRY_OR_UNBOUNDED_DOWNLOAD_BUILD_STORAGE
stageb_authorized: false
shared_file_writer: MAINLINE_ONLY
failure_state: BLOCKED_USER_ACTION_REQUIRED
failure_evidence_ceiling: RESOURCE_FAILURE_ONLY__NO_SCIENTIFIC_INFERENCE

