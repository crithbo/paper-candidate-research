schema: stage0a-identity-blind-r3-candidate-source-pool-v1
frozen_at: '2026-08-27'
status: CANDIDATE_POOL_ONLY__PACKER_MUST_VERIFY_ELIGIBILITY
selection_preimage: exact ordered list below
selection_rule:
  - remove excluded identities and any candidate failing Q2-or-equivalent, public-evidence, historical-cutoff, or hard-gate preflight
  - within each contribution stratum order LOW before MEDIUM before HIGH identity risk
  - within equal risk order by uppercase SHA256 of normalized_identity_key
  - take first three qualified identities per stratum
  - no result-aware replacement; use next item in the same frozen ordering only
normalized_identity_key: lowercase_ascii(title)|year|venue
tie_rule: lexical normalized_identity_key

