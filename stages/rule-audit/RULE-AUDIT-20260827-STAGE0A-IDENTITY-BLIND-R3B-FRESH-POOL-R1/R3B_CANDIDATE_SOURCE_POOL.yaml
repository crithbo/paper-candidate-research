uniform_prequalification_contract:
  required_for_every_row:
    - exact title is present on the official venue page
    - year and venue match the official BibTeX block
    - official page states USENIX Open Access and exposes a Download/PDF link
    - identity is absent from the frozen exclusion ledger, including aliases
    - one contribution stratum is assigned from the paper's stated object and contribution
  precheck_date: '2026-08-27'
  precheck_basis: OFFICIAL_USENIX_EVENT_PAGE__OPEN_ACCESS_MEDIA__DOWNLOAD_LINK_VISIBLE
  network_or_download_action: WEB_PAGE_READ_ONLY__NO_PROJECT_RESOURCE_DOWNLOAD
  scientific_quality_or_gate_inference: NONE

identity_normalization:
