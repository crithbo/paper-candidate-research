  encoding: UTF-8_WITHOUT_BOM
  hash: SHA256_UPPERCASE_HEX
  apostrophe_rule: NORMALIZE_TYPOGRAPHIC_APOSTROPHE_TO_ASCII_APOSTROPHE
  venue_rule: USE_EXACT_LOWERCASE_VALUE_FROZEN_IN_IDENTITY_KEY

deterministic_selection_rule:
  risk_order: [LOW, MEDIUM, HIGH]
  within_risk_order: ASCENDING_IDENTITY_KEY_SHA256
  per_stratum_target_count: 3
  per_stratum_reserve_count: 1
  fallback_count_per_stratum: 2
  proposed_total: {target: 12, reserve: 4, fallback: 8, pool: 24}
  replacement_rule: NEXT_ITEM_IN_SAME_FROZEN_STRATUM_ORDER_ONLY
  result_aware_replacement: forbidden
  later_cross_stratum_borrowing: forbidden

identity_risk_contract:
  scope: REVIEWER_IDENTITY_RECOGNITION_RISK_ONLY__NOT_SCIENTIFIC_QUALITY
  LOW: title or system is not marked by the official page as an award identity and is not treated here as a canonical household benchmark
  MEDIUM: acronym or topic is plausibly recognizable to a specialist
  HIGH: official page exposes an award marker or the identity is especially distinctive
  risk_must_not_be_recomputed_after_packet_review: true

