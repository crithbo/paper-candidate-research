  - case_id: N02_GENERIC_WRAPPER
    source_kernel: LLVM Zicbop generic prefetch scheduling failure family
    hidden_fault: wrapper/controller without non-generic mechanism or distinct claim endpoint
    expected: SCIENTIFIC_STOP
  - case_id: N03_SAME_INFORMATION_SELECTOR
    source_kernel: COH-REGION-LIFECYCLE historical failure family
    hidden_fault: selector is absorbed under the same information set and comparator
    expected: SCIENTIFIC_STOP_OR_MATERIAL_SCOPE_CONTRACTION
  - case_id: N04_GENERIC_PARTITION_SOLVER
