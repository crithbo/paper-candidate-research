forbidden_for_executor:
  - the fact that this is a backtest or calibration case
  - positive-control or negative-control label
  - expected decision or known publication success
  - paper titles
  - authors
  - venues
  - DOI and URLs
  - final quantitative results
  - acceptance or award status
  - source_kernel identifiers for negative controls
  - post-cutoff papers, issues, releases, and adoption evidence
  - author method implementation and author reproduction scripts
  - CASE_POOL.yaml, SOURCE_LEDGER.md, and all auditor-only materials
executor_visible_pack_requirements:
  - random neutral case id unrelated to paper, venue, or audit id
  - path outside the visible RULE_AUDIT directory
  - rewritten technical description with no searchable verbatim paper phrases
  - frozen pre-publication source universe for independent collision review
  - neutralized canonical inputs and comparator interface
  - no git remote, citation metadata, paper filenames, license headers, or comments that reveal identity
contamination_rule:
  signal: BLINDING_CONTAMINATION
  action: STOP_CASE_WITHOUT_SCIENTIFIC_DECISION_AND_USE_PREREGISTERED_ALTERNATE
  denominator_effect: EXCLUDE_AND_REPORT
