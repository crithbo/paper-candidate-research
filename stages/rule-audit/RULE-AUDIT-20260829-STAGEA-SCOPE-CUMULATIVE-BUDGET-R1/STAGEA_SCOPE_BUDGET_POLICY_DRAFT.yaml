    claim_bearing: true
    natural_or_formal_cases_min: 1
    natural_or_formal_cases_default_max: 4
    strongest_baselines_min: 1
    additional_attribution_baselines_max: 1
    evidence_ceiling: PRELIMINARY_SUPPORT_OR_DECISIVE_REFUTATION_ONLY
  A2_INDEPENDENT_GATE:
    claim_bearing: false
    reviewer_creates_primary_evidence: false
topic_cumulative_budget:
  engineering_correction_batches_max: 2
  a0_execution_rounds_max: 3
  same_object_method_redesigns_max: 1
  new_assignment_resets_budget: false
  queue_wait_and_external_blocker_not_execution_round: true
  a0_ready_next_eligible_action: A1_DECISIVE_PILOT_OR_BLOCKER
result_firewall:
  active_through: A0_EXECUTION_READINESS
  visible_fields:
    - exit_code
    - required_output_presence
    - schema_validity
    - missing_metric_or_path
    - version_drift
    - timeout
  forbidden_fields:
    - candidate_vs_baseline_effect
    - speedup
    - pareto_rank
    - relative_performance
stagea_scope:
  required:
    - complete_atomic_semantics_on_minimal_instance
    - current_strongest_fair_baseline
    - natural_or_formal_evidence
    - mechanism_specific_metric
    - directional_full_cost
    - reproducibility
  deferred_to_stageb:
    - full_workload_matrix
    - multi_platform_closure
    - paper_grade_statistics
    - full_baseline_grid
    - complete_ablation_suite
    - paper_grade_full_cost_closure
integrity:
  recursive_tree_hash_default: false
  claim_critical_hash_at_freeze_and_handoff: true
  shared_executable_hash_at_asset_registration: true
  auxiliary_logs_check: existence_size_count
status_layering:
  topic_formal_state_separate_from_assignment_execution_substate: true
  execution_contract_hold_is_topic_formal_state: false
  no_scientific_observation_from_invalid_construction: true
activation:
  historical_shadow_replay_required: true
  prospective_shadow_topics_required: 2
  user_policy_approval_required: true
  mainline_cutover_required: true
  rule_audit_may_modify_shared_files: false
