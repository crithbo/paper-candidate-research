status: PROPOSAL_ONLY__NOT_EFFECTIVE
formal_pipeline_changed: false
internal_modes:
  A0_EXECUTION_READINESS:
    claim_bearing: false
    required:
      - one_natural_canonical_or_formal_input_or_result_independent_selection_rule
      - one_current_strongest_same_function_baseline
      - semantically_complete_minimal_candidate_mechanism
      - legality_equivalence_object_identity_witness
      - mechanism_specific_metric
      - decision_reversing_full_cost_dimensions_and_collectors
      - exact_argv_cwd_env_output_schema
      - one_nonclaim_control_row
