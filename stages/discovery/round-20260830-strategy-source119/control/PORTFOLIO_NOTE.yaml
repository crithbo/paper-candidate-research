schema: discovery-source-portfolio-v1
round_id: SOURCE119
goal: Refresh canonical opportunity families around the user's cloud-edge heterogeneous LLM/VLA compiler-runtime-memory core while avoiding Source118 and DMR anchor repetition.
global_filters:
  exact_identity_or_terminal_contains_only: exclude
  related_only: retain_if_action_estimand_endpoint_guarantee_or_full_cost_differs
  current_upstream_reality_check: mandatory_when_absence_is_claimed
  public_single_gpu_cpu_first: preferred
  linux_or_unavailable_hardware_dependency: route_as_resource_boundary_not_scientific_drop
lanes:
  S1:
    viewpoint: BOUNDARY_CONTRADICTION
    portfolio: current first-party IREE/MLIR/LLVM/ExecuTorch or accelerator-backend semantic and cost mismatches
    preferred_contribution_types: [COMPILER_TOOL, REPLICATION_NEGATIVE, MEASUREMENT_CHARACTERIZATION]
  S2:
    viewpoint: BOTTLENECK_TRANSFER
    portfolio: single-GPU long-context inference bottlenecks after KV offload/prefix reuse in vLLM/SGLang/LMCache-class current stacks
    preferred_contribution_types: [SYSTEM_ARCHITECTURE, METHOD_ALGORITHM]
  S3:
    viewpoint: NATURAL_STRUCTURE
    portfolio: public agent/VLA/long-session traces or canonical workloads whose temporal, prefix, topology or sparsity structure changes a fixed decision
    preferred_contribution_types: [MEASUREMENT_CHARACTERIZATION, BENCHMARK_DATASET, METHOD_ALGORITHM]
  S4:
    viewpoint: OBJECTIVE_CONSTRAINT
    portfolio: edge-cloud placement, cold-start, thermal, SLO and full-cost validity under public single-GPU/CPU or canonical edge workloads
    preferred_contribution_types: [SYSTEM_ARCHITECTURE, MEASUREMENT_CHARACTERIZATION, BENCHMARK_DATASET]
  S5:
    viewpoint: SCALE_ONLINE_APPROX
    portfolio: online or approximate low-bit/KV/memory-planning algorithms with fixed semantics, information and strongest baselines
    preferred_contribution_types: [METHOD_ALGORITHM, COMPILER_TOOL]
  S6:
    viewpoint: DIRECT_ALGORITHM_SOFTWARE
    portfolio: direct target-specific compiler/runtime/kernel data structures or algorithms beyond configuration tuning
    preferred_contribution_types: [METHOD_ALGORITHM, COMPILER_TOOL, SYSTEM_ARCHITECTURE]

