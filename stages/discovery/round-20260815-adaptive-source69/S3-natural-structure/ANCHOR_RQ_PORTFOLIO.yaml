  items:
    - id: S69-SEED-01
      engine: CONTRADICTION_PAIRING
      sketch: >-
        A public sequence of canonical compiler regression inputs could show that
        a size-neutral IR change produces a repeatable offline code-generation
        cost reversal under a fixed target and semantic contract.
      conclusion_first_test: >-
        A viable result would make one static representation or scheduling
        decision falsifiably different from a configuration selector.
      anchor_candidate: UNFROZEN
    - id: S69-SEED-02
      engine: CONSTRAINT_MANIPULATION
      sketch: >-
        Versioned public model graphs may keep logical operators fixed but change
        shape-cohort persistence sufficiently to alter an offline data-movement
        construction with a fixed runtime endpoint.
      conclusion_first_test: >-
        The law must survive a stated confound control and lead to a whole
        non-controller construction, not a cache or dispatch policy.
      anchor_candidate: UNFROZEN
    - id: S69-SEED-03
      engine: STRUCTURAL_ANALOGY
      sketch: >-
        Canonical database workload histories may contain stable query-template
        recurrence transitions that bear on an offline physical representation
        while retaining the same query semantics.
      conclusion_first_test: >-
        The cautious outcome would price construction, storage and query cost
        against a fixed stock reader/engine boundary.
      anchor_candidate: UNFROZEN
    - id: S69-SEED-04
      engine: ASSUMPTION_REVERSAL
      sketch: >-
        A public accelerator trace series may disprove the assumption that a
        single aggregate utilization value determines a static mapping choice by
        exhibiting stable phase order at equal aggregate load.
      conclusion_first_test: >-
        Only a same-object offline mapping action with a held-out falsifier would
        make this more than descriptive measurement.
      anchor_candidate: UNFROZEN
    - id: S69-SEED-05
      engine: COMPOSE_DECOMPOSE_SIMPLIFY
      sketch: >-
        Consecutive releases of a canonical formal benchmark may retain repeated
        subformulas whose structural drift changes a complete offline ordering or
        representation construction without altering checked semantics.
      conclusion_first_test: >-
        The proposed contribution would need a target-specific action and full
        construction/checking cost, rather than generic packing.
      anchor_candidate: UNFROZEN
    - id: S69-SEED-06
      engine: ABSTRACT_LADDER
      sketch: >-
        Public software build-artifact histories may expose a stable lifetime law
        for semantically equivalent intermediate units that can alter an offline
        compiler or data-structure construction.
      conclusion_first_test: >-
        Any topic must retain reader semantics and identify a finite natural
        carrier before it can be framed as an N2/N3 opportunity.
      anchor_candidate: UNFROZEN
