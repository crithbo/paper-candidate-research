        relation: DIRECT
        locator: Dynamic Shape Support section
        evidence_status: DIRECT_OBSERVATION
        conflict: no exact low-bit exception established.
        permitted_conclusion: no capture-island raw package is admitted.
  - claim_id: C107-04
    text: Triton current kernels support runtime-shape/ragged handling and masking patterns; meanwhile the only searched TorchAO compile failure was an issue-level missing Meta registration rather than a public native LLM carrier plus non-generic action.
    priority: MEDIUM
    priority_rationale: rejects tail decomposition and single-issue repair as evidence-qualified raw.
    source_links:
