claims:
  - claim_id: C107-01
    text: Current torch.compile already provides automatic and user-directed dynamic-shape mechanisms, guard/recompile diagnostics, dynamic-source controls and eager fallback after its cache/recompile boundary.
    priority: HIGH
    priority_rationale: determines whether a proposed dynamic-shape guard treatment is merely a configuration/diagnostic wrapper.
    source_links:
      - source_id: S107-01
        relation: DIRECT
        locator: dynamic, recompile_limit, fullgraph and options sections
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: no generic dynamic-shape/guard management action is a residual without a named exact source-level low-bit exception.
      - source_id: S107-02
        relation: DIRECT
        locator: automatic dynamic and guards sections
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: overspecialization is diagnosable but documentation does not by itself establish a novel low-bit action.
      - source_id: S107-03
        relation: DIRECT
        locator: automatic_dynamic_shapes and recompile configuration
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: a generic recompile/mark-dynamic policy is current implementation behavior.
  - claim_id: C107-02
    text: Current TorchAO exposes low-bit configuration, group-size and packing-format choices and is documented as composing with torch.compile across most HuggingFace models.
    priority: HIGH
    priority_rationale: bounds the proposed low-bit layout-certificate, configuration and fallback ideas.
    source_links:
      - source_id: S107-04
        relation: DIRECT
        locator: int4/float8 inference workflow table
        evidence_status: DIRECT_OBSERVATION
        conflict: exact dynamic-shape fallback locus not established.
        permitted_conclusion: configurations are not evidence of a new compiler action.
      - source_id: S107-05
        relation: DIRECT
        locator: Int4WeightOnlyConfig source
        evidence_status: DIRECT_OBSERVATION
        conflict: no named code-generation-only low-bit fallback was found.
        permitted_conclusion: a new packing format or dispatch metadata path would be high-risk repeat/generic work.
      - source_id: S107-06
        relation: DIRECT
        locator: repository overview
        evidence_status: AUTHOR_CLAIM
        conflict: “most” models is not an exact LLM carrier/guarantee.
        permitted_conclusion: it supplies broad compatibility context only, not raw admission.
  - claim_id: C107-03
    text: Current CUDAGraph Trees already describes dynamic-shape rerecording, dynamic-graph skip and shape padding; a bare captured-island or capture partition formulation is consequently current/generic unless a separately evidenced low-bit semantic boundary remains.
    priority: HIGH
    priority_rationale: RQ-S107-04 current collision check.
    source_links:
