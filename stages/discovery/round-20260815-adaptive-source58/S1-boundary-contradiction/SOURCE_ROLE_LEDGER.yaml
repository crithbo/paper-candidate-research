  - id: SRC03_WASMTIME_CANONICAL_OPTIONS
    role: CURRENT_LOCATOR
    url: https://docs.wasmtime.dev/api/wasmtime_environ/component/struct.CanonicalOptions.html
    version_or_date: current API documentation observed 2026-08-15
    provenance: upstream Wasmtime API documentation
    finding: current component options contain a specified post-return function locus.
  - id: SRC04_COMPONENT_MODEL_REPOSITORY
    role: CONTRARY_ROUTE
    url: https://github.com/WebAssembly/component-model
    version_or_date: main branch observed 2026-08-15
    provenance: upstream design/specification repository
    finding: the anchor surface is actively specified; no inference about implementation absence is drawn.
