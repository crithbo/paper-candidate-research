primary_rq:
  question: Can an agent-level shared-randomness coupling for two real copy-isolated OpenHands coding-agent branches preserve the frozen paired counterfactual estimand while materially reducing variance or sample complexity relative to independent branch rollout after token and tool-state divergence?
  primary_only: true
  alternatives_allowed: 0

required_mechanism_and_guarantee:
  token_coupling:
    - precise coupling after contexts and logit distributions diverge
    - explicit Gumbel-Max SCM, maximal coupling, or equally precise construction
    - recoupling rule and coupling-failure detection
  agent_state_coupling:
    - semantics for tool outputs, filesystem, processes, tests, context and evaluator
    - explicit keep-shared, split, stop and uncomparable transitions
    - treatment, evaluator and cross-branch firewalls
  target_specific_guarantee_at_least_one:
    - unbiasedness_or_consistency_conditions
    - variance_or_sample_complexity_improvement_bound
    - direct_effect_separation_conditions_relative_to_forward_replay
    - conservative_fallback_when_coupling_fails

