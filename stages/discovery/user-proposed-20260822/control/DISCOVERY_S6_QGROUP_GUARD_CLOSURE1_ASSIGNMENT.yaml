bounded_closure_questions:
  - Resolve v0.26.0 to an immutable official commit and freeze the exact W4A16 Triton kernel, caller and BLOCK_K/group_size guard.
  - Enumerate the current native schedule and metadata actions relevant to tiling, tail, fusion, group index and scale/zero loads, including default and non-default paths.
  - Determine whether any residual repair is more than BLOCK_K less-than-or-equal-to group_size, a smaller-tile fallback or a generic verifier/schema.
  - Seek source-supported evidence for at least two materially distinct error mechanisms or repair choices; absence within the bounded search is not itself fatal, but a proven one-check-only action space is.
  - Compare against current MLIR Quant blockwise integrity, Triton verification surfaces and the CAKE primary paper/current artifact without assuming they directly absorb the frozen vLLM object.
  - Determine whether the NVIDIA and AMD paths share the same native action and guarantee; otherwise narrow to one target rather than combining changed objects.

