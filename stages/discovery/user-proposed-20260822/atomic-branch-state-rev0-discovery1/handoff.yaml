  code: DROP__GENERIC_CROSS_LAYER_TRANSACTION_COMPOSITION_AND_NATIVE_OBJECT_UNCLOSABLE
  authorized_class: DROP
  scientific_basis:
    - The frozen OpenHands SDK anchor exposes composable LLM/agent/conversation/tool/workspace APIs but no native joint ownership of model KV and sandbox process/filesystem C/R state.
    - Therefore no same-object native two-action witness can contain the required all-plane commit/abort/restore action.
    - Adding external owners leaves a durable epoch prepare/commit record as the only specific linearization point; that is generic multi-resource transaction/checkpoint composition, which the assignment explicitly excludes.
    - Shepherd, Crab, Atomix and transaction-local KV restore supply the relevant specialised branch, sandbox, tool-transaction and KV-rollback planes; their combination is not itself a target-specific residual.
