schema: discovery-source-portfolio-v1
round_id: SOURCE120
goal: Start from exact public carriers before RQ convergence and rebalance toward contribution types that can form Q2 papers without inventing an unimplemented action.
lanes:
  S1: {viewpoint: BOUNDARY_CONTRADICTION, portfolio: cross-backend conformance and semantic-boundary artifacts in StableHLO/ONNX/MLIR/IREE current specs and tests, preferred_types: [COMPILER_TOOL, REPLICATION_NEGATIVE, BENCHMARK_DATASET]}
  S2: {viewpoint: BOTTLENECK_TRANSFER, portfolio: versioned public single-GPU serving traces/simulators and queue-memory interactions with fixed placement/admission decisions, preferred_types: [MEASUREMENT_CHARACTERIZATION, SYSTEM_ARCHITECTURE]}
  S3: {viewpoint: NATURAL_STRUCTURE, portfolio: public long-context/agent/VLA datasets or traces with pre-existing timestamps/prefix/topology fields and decision-changing estimands, preferred_types: [MEASUREMENT_CHARACTERIZATION, BENCHMARK_DATASET, N3]}
  S4: {viewpoint: OBJECTIVE_CONSTRAINT, portfolio: canonical benchmark validity/ranking reversal and resource-bounded formal small-state guarantees for compiler/runtime scheduling, preferred_types: [BENCHMARK_DATASET, THEORY_FORMAL, MEASUREMENT_CHARACTERIZATION]}
  S5: {viewpoint: SCALE_ONLINE_APPROX, portfolio: online cache/KV/session-memory algorithms on fixed public traces with explicit strongest baseline and full-cost, preferred_types: [METHOD_ALGORITHM, SYSTEM_ARCHITECTURE]}
  S6: {viewpoint: DIRECT_ALGORITHM_SOFTWARE, portfolio: target-specific compiler/runtime data structures or negative replication from current merged tests and exact public fixtures, preferred_types: [COMPILER_TOOL, METHOD_ALGORITHM, REPLICATION_NEGATIVE]}
global_filters: {exact_carrier_before_rq: true, current_upstream_reality_check_when_absence_claimed: true, related_only_not_cooldown: true, linux_resource_boundary_not_scientific_drop: true}

