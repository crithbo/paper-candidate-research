schema_version: discovery-selection-method-audit-deltas-v2
role: DISCOVERY-BACKTEST-AUDITOR
audit_verdict: PATCH_WITH_BACKTEST
authority: ADVISORY_ONLY_MAINLINE_DECIDES
production_rule_change_authorized: false
material_method_change: true
withdrawn_prior_recommendation: "Observed natural headroom/theorem witness is not a Pre-Stage0 hard admission requirement."
observed_basis:
  production_funnel: {raw: 30, grounded_briefs: 6, stage0_revise_once: 6}
  method_v2_backtests: {calibrated_lenses: 6, production_candidate_evidence: false}
  tier_recalibration: {tier_a: 3, tier_b: 2, below_q2_pending_decisive: 1}
  cross_cutting_facts: [natural_headroom_not_proven_for_any_six, five_stage0_gates_atomic_and_one_nonatomic, resource_absence_not_used_as_stop]
proposed_deltas:
  - id: D1_TWO_AXIS_ADMISSION
    change: "Separate STRUCTURAL_PAPER_POTENTIAL from EVIDENCE_ACQUISITION_RISK_READINESS and CORE_GATE_STATE."
    structural_stop_only_when: [strong_same_object_absorption_if_successful, no_n1_n2_n3, object_or_fair_comparison_undefined, ordinary_tuning_or_wrapper, no_credible_paper_shape]
    readiness_role: ranking_route_claim_ceiling_not_academic_stop
  - id: D2_PLAN_SUFFICIENT_READINESS
    change: "Require a frozen object boundary, definable natural/theorem target, preregistrable baseline/cost/repro route, and one finite atomic killer plan; do not require evidence already obtained."
    permitted_missing_inputs: [implementation, experiment, natural_corpus, theorem_proof, commodity_hardware]
    fallback: HUMAN_RESEARCH_RESERVE_or_risk_flag_when_route_is_human_dependent
  - id: D3_RESIDUAL_FIRST
    change: "Establish structural residual before naming mechanism; evidence plan then tests rather than defines potential."
  - id: D4_STOP_HARD_NEGATIVES
    change: "Use de-identified terminal STOP failure modes as sealed controls without reopening IDs."
  - id: D5_COLLISION_CEILING_ATOMIC_LINT
    change: "Add brief-level object/version/finite-baseline screen; retain Stage0 full collision; require claim ceiling/resource route and atomic-gate lint."
  - id: D6_TWO_AXIS_METRICS
    change: "Track potential yield separately from evidence-risk/closure outcomes and zero-proposal calibration."
backtest_requirement:
  required_before_production: true
  protocol: independent_sealed_packer_executor_auditor
  coverage: {lenses: 6, positives_per_lens: 3, negative_controls_per_lens_min: 1}
  positive_strata: [evidence_ready, evidence_incomplete_but_finite_route]
  negative_strata: [baseline_or_selector_absorption, no_novelty_route, undefined_object_or_fairness, ordinary_tuning_or_wrapper, no_finite_evidence_route]
  additional_acceptance:
    structural_potential_recoveries_minimum: 2_of_3_per_lens
    evidence_incomplete_positive_misclassified_as_stop: forbidden
    structural_hard_negative_forced_packaging_allowed: false
    atomic_gate_required: true
    decisive_leakage: CONTAMINATION_UNKNOWN
  prohibited_interpretation: [candidate_evidence, novelty_evidence, headroom_evidence, feasibility_evidence]
