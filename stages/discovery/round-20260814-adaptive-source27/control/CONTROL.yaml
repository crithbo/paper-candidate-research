profile_id: SOURCE27_ORIGIN_GROUNDED_ORTHOGONAL_RESIDUAL_V1
scope: ONE_SIX_LANE_ASSIGNMENT_ONLY
authority:
  continuous_discovery: USER_ADAPTIVE_DISCOVERY_CONTINUE_UNTIL_FIVE_STAGEA_PASS_20260814
  bounded_public_acquisition: USER_BLOCKER_AUTONOMOUS_OPEN_SOURCE_ACQUISITION_20260814
activation_record: stages/discovery/round-20260814-adaptive-source27/control/ACTIVATION_RECORD.yaml
source_origin_capsules: stages/discovery/round-20260814-adaptive-source27/control/SOURCE_ORIGIN_CAPSULES.yaml
canonical_method: V8_7_POTENTIAL_READINESS_SEPARATED
discovery_claim_pack_mode: OFF
v9_output_allowed: false
network_security_topics_allowed: false

capacity:
  source_origin_capsules_per_lane_max: 2
  offline_seeds_per_lane_max: 12
  offline_seeds_per_capsule_max: 6
  exact_selected_locators_per_lane_max: 3
  fresh_raw_per_lane_max: 3
  C0_per_lane_max: 2
  deep_by_lane: {S1: 2, S2: 2, S3: 2, S4: 3, S5: 1, S6: 2}
  proposal_quota: none
  outcome_aware_backfill: false

origin_capsule_contract:
  frozen_before_dispatch: true
  required_fields:
    - exact_public_artifact_or_deterministic_locator
    - version_date_or_commit_selection_rule
    - provenance_and_license
    - object_class
    - allowed_carrier_class
    - source25_26_cooldown_check
  no_novelty_or_outcome_claim: true
  no_absence_claim: true
  no_answer_aware_ranking: true

selected_locator_contract:
  required_before_lookup:
    - capsule_id
    - exact_object_identity
    - contribution_type
    - claim_endpoint
    - atomic_action_or_estimand
    - native_or_canonical_carrier
    - cheapest_falsifier
  abstract_domain_bucket_forbidden: true
  pairwise_orthogonality:
    axes: [exact_object, contribution_type, atomic_action_or_estimand, carrier, falsifier]
    minimum_different_axes: 2
  source25_26_cooldown:
    cycles: 1
    applies_to: SAME_EXACT_IDENTITY_OR_SAME_TOOL_SURFACE_PLUS_ENDPOINT
    reentry_requires: PRECOMMITTED_CONTENT_ADDRESSABLE_EVIDENCE_DELTA

source_role_contract:
  decisive_single_source_may_structurally_exclude: true
  surviving_locator_requires:
    - content_addressable_carrier_or_problem_anchor
    - current_source_or_native_action_union
    - contrary_primary_same_object_or_bounded_not_found_record
  one_document_cannot_fill_all_survival_roles: true
  contrary_not_found_semantics: BOUNDED_SEARCH_OPEN__NOT_GLOBAL_ABSENCE

retrieval:
  authority: USER_BLOCKER_AUTONOMOUS_OPEN_SOURCE_ACQUISITION_20260814
  attempts_per_locator_max: 2
  successful_response_bytes_per_attempt_max: 8388608
  persisted_bytes_per_locator_max: 16777216
  successful_response_bytes_per_lane_max: 67108864
  storage_bytes_per_lane_max: 134217728
  full_dataset_download_required: false
  build_install_experiment_allowed: false
  required_ledger_fields:
    - url_or_deterministic_rule
    - selection_rule
    - source_role
    - version_or_date
    - license_or_provenance
    - response_bytes_when_observable
    - sha256_when_bytes_persisted
    - disposition
  readable_reporting: USE_PLAIN_CHINESE_FOR_MISSING_RUNTIME_TELEMETRY

question_card:
  required_before_fresh_raw: true
  template: templates/DISCOVERY_QUESTION_CARD.md
  finite_closure_route_means: SOURCED_BOUNDED_PATH__NOT_COMPLETED_IMPLEMENTATION_OR_MAIN_RESULT
  missing_implementation_or_result_alone: NOT_A_SCIENTIFIC_DROP

disposition:
  healthy_structural_abstention:
    - DIRECT_CURRENT_ABSORPTION
    - SAME_OBJECT_FAILURE
    - GENERIC_KERNEL
    - CHANGED_GUARANTEE
    - DIRECT_PAPER_OWNED_CONSTRUCTOR
  public_evidence_unclosed: LOCATOR_ONLY__PUBLIC_EVIDENCE_UNCLOSED
  execution_or_telemetry_limited: LOCATOR_ONLY__EXECUTION_TELEMETRY_LIMITED__NO_SCIENTIFIC_INFERENCE

required_outputs:
  - SOURCE_ORIGIN_USE.md
  - DIVERGENCE_SEED_POOL.md
  - QUESTION_CARDS.md
  - SOURCE_ROLE_LEDGER.yaml
  - DISCOVERY_LOG.md
  - SOURCE_COLLISION_MATRIX.md
  - handoff.yaml
completion_funnel:
  - source_origin_capsule
  - offline_seed
  - selected_exact_locator
  - excluded_before_raw
  - public_evidence_unclosed
  - execution_telemetry_limited
  - fresh_raw
  - C0
  - D1
  - deep
  - clean_brief
completion:
  zero_brief_allowed: true
  notify_mainline_immediately_on_clean_brief_blocker_or_finish: true
  return_lane_state: IDLE_REUSABLE_AWAITING_MAINLINE
post_round:
  user_instruction: PAUSE_AFTER_SOURCE27_AND_REPORT_OVERALL_PROGRESS
  new_discovery_assignment_after_all_six_handoffs: forbidden_until_user_resumes
  clean_brief_stage0_routing_during_source27: allowed
  already_active_frozen_stage_work_may_finish: true
prohibited:
  - V9_output
  - network_security
  - experiment
  - E2
  - build
  - install
  - Stage0_A_B
  - automation
  - outcome_aware_backfill
  - STOP_revival
