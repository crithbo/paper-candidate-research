        relation: DIRECT
        locator: GGML_CUDA_FA_ALL_QUANTS option declaration
        evidence_status: DIRECT_OBSERVATION
        conflict: build option alone does not prove runtime behavior for every configuration.
        permitted_conclusion: a build capability boundary exists, not a paper contribution.
      - source_id: S108-08
        relation: OPPOSE
        locator: issue report and requested warning/default change
        evidence_status: AUTHOR_CLAIM
        conflict: one issue; no canonical research carrier or independent reproduction.
        permitted_conclusion: excluded as a single-issue routine configuration/UX repair, not raw.
