claims:
  - claim_id: C108-01
    text: FlashInfer 0.6.18 documents a versioned paged-KV plan/run contract, including explicit causal/window/LSE inputs and plan-state constraints; its current tests cover fragmented pages, ragged accumulation and causal/window modes against references.
    priority: HIGH
    priority_rationale: direct current counterevidence for generic paged-KV semantic-boundary replication.
    source_links:
      - source_id: S108-01
        relation: DIRECT
        locator: attention API plan/run, window_left and LSE sections
        evidence_status: DIRECT_OBSERVATION
        conflict: API documentation alone does not exhaust all internal state transitions.
        permitted_conclusion: no unspecified page-table/causal contract gap is admissible.
      - source_id: S108-02
        relation: DIRECT
        locator: fragmented cache, causal/window parametrization and reference assert-close test loci
        evidence_status: DIRECT_OBSERVATION
        conflict: no named untested same-object semantic failure was found.
        permitted_conclusion: a generic oracle/checker or routine additional test is not raw-admissible.
      - source_id: S108-03
        relation: DIRECT
        locator: plan-not-model-logic comment and BatchDecode wrapper lifecycle
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: plan setup is an explicitly separated artifact phase, not an implicit semantic or graph-capture novelty gap.
  - claim_id: C108-02
    text: Current FlashInfer FP8 paged-KV tests compare wrapper results to a reference through MSE, while a public vLLM report evaluates FlashInfer-backed FP8 KV cache at deployment quality/system level.
    priority: HIGH
    priority_rationale: closes an unqualified unit-test-to-decode measurement route.
    source_links:
      - source_id: S108-04
        relation: DIRECT
        locator: FP8 quantization, wrapper plan/run and reference MSE loci
        evidence_status: DIRECT_OBSERVATION
        conflict: a unit MSE test alone is not deployment quality evidence.
        permitted_conclusion: one needs a new exact estimand/action, not merely more FP8 test cases.
      - source_id: S108-05
        relation: OPPOSE
        locator: FlashInfer backend deployment-quality/system report
        evidence_status: AUTHOR_CLAIM
        conflict: source-specific platform scope.
        permitted_conclusion: broad FP8 KV quality/performance characterization is already current and cannot be admitted without a distinct exact residual.
  - claim_id: C108-03
    text: FlashInfer-Bench already supplies real serving traces and a correctness/performance-aware benchmark framework; generic benchmark harness correction is therefore directly constrained.
    priority: HIGH
    priority_rationale: RQ-S108-04 benchmark contribution gate.
    source_links:
      - source_id: S108-06
        relation: OPPOSE
        locator: abstract and artifact description
        evidence_status: AUTHOR_CLAIM
        conflict: no proof it covers every exact FlashInfer harness mode.
        permitted_conclusion: no generic real-trace benchmark dataset proposal is admitted; an exact estimator defect and decision reversal would still be required, and none was frozen.
  - claim_id: C108-04
    text: llama.cpp current source keeps GGML_CUDA_FA_ALL_QUANTS off by default, and a public issue describes a resulting quantized-KV CPU fallback and proposes a build-default or warning remedy.
    priority: HIGH
    priority_rationale: bounds the exact artifact-level negative-replication alternative.
    source_links:
