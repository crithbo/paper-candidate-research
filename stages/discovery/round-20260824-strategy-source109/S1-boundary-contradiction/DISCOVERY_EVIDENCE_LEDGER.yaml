claims:
  - claim_id: C109-01
    text: Current TensorRT-LLM documentation explicitly specifies context/generation attention implementations and FP8 paged-context prerequisites; no source-visible implementation-only, same-semantics plugin exclusion was identified.
    priority: HIGH
    priority_rationale: bounds RQ-S109-01/02/03.
    source_links:
      - source_id: S109-01
        relation: DIRECT
        locator: context FMHA, FP8 paged context FMHA and generation phase sections
        evidence_status: DIRECT_OBSERVATION
        conflict: docs cannot prove every unimplemented configuration is semantic.
        permitted_conclusion: no generic plugin eligibility/configuration action is raw-admissible without an exact uncovered locus.
  - claim_id: C109-02
    text: Current ORT GenAI exposes generator/cache configuration including past-present sharing, and its public native paged-attention route replaces GroupQueryAttention with PagedAttention plus explicit page metadata and a pinned real-model integration artifact.
    priority: HIGH
    priority_rationale: same-object public carrier gate for ORT GenAI RQs.
    source_links:
      - source_id: S109-02
        relation: DIRECT
        locator: Generate API overview
        evidence_status: DIRECT_OBSERVATION
        conflict: preview API may evolve.
        permitted_conclusion: API-level cache claims require exact native carrier evidence.
      - source_id: S109-03
        relation: DIRECT
        locator: Search past_present_share_buffer and max_length sections
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: generic cache ownership measurement is not a new action.
      - source_id: S109-04
        relation: DIRECT
        locator: Paged-attention Engine test and pinned Qwen artifact
        evidence_status: DIRECT_OBSERVATION
        conflict: integration test excludes performance/scaling/long-lived behavior.
        permitted_conclusion: this is the native public carrier, but it is PagedAttention rather than the GQA staging object.
      - source_id: S109-06
        relation: DIRECT
        locator: use_paged_attention builder description
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: GQA is replaced in the current native paged route, so GQA-specific staging cannot inherit that carrier.
  - claim_id: C109-03
    text: Current GroupQueryAttention stages every multi-token windowed-cache step because its interface cannot distinguish prompt/chunk running state; this is a deliberate correctness choice, but a phase-metadata branch alone is an unadmitted interface repair and lacks a same-object native public carrier.
    priority: HIGH
    priority_rationale: exact action-survival gate for the only concrete source contradiction.
    source_links:
      - source_id: S109-05
        relation: DIRECT
        locator: windowed cache staging comment and implementation path
        evidence_status: DIRECT_OBSERVATION
        conflict: no source demonstrates the branch has a nontrivial performance/semantic paper residual.
        permitted_conclusion: do not turn the source comment into a raw proposal without a same-object carrier, distinct algorithm and full-cost route.
      - source_id: S109-04
        relation: OPPOSE
        locator: native paged Engine artifact uses PagedAttention
        evidence_status: DIRECT_OBSERVATION
        conflict: GQA and PagedAttention differ in exact object/interface.
        permitted_conclusion: natural-carrier requirement fails for a GQA staging claim.
  - claim_id: C109-04
    text: A public closed shared-KV GQA issue contains a concrete operator-support request and workaround, so it is not a standalone replication-negative research package.
    priority: MEDIUM
    priority_rationale: bounds issue-derived ORT graph routes.
    source_links:
