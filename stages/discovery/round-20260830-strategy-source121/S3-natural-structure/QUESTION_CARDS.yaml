    exact_identity: LeRobot_commit_4aaff99be4a1d81568c08c8f0296b41b40c99ec4_distributed_async_inference
    same_object_problem: Queue-threshold dispatch can execute actions whose generating observation is old under variable network/inference latency; the current source records the needed clocks but exposes no explicit age SLO.
    claim_endpoint: Tail action-observation age violations and safe no-idle execution under the same policy/action protocol.
    counterfactual_consequence: If age rather than queue occupancy predicts unsafe or ineffective decisions, the runtime should dispatch earlier or reject/trim late chunks despite identical queue size.
    non_generic_discriminant: Two states with equal queue occupancy but different observed latency/observation age must receive different dispatch or admission decisions.
    current_source_locus: robot_client.py::_ready_to_send_observation plus TimedObservation/TimedAction paths and configs.py::RobotClientConfig
    minimum_falsifier: No Pareto improvement over a fully tuned fixed-threshold controller under matched policy task success inference calls network bytes and safe-stop/idle accounting, or direct current-work coverage of the same AoI-SLO action.
    finite_closure_route: Source-level controller preflight; deterministic timestamp/queue witness; canonical RoboCasa or LeRobot episode replay; variable measured latency traces; same-policy comparison against tuned threshold and RTC where semantically applicable.
    full_cost_initial_boundary: Inference calls, transmitted bytes, control-loop time, queue occupancy, action discards, idle/safe-stop events, task success, and tail observation age.
