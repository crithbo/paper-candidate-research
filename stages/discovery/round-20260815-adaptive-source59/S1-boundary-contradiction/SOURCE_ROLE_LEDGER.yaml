    role: ANCHOR
    url: https://www.uclibc.org/docs/psABI-x86_64.pdf
    version_or_date: AMD64 ABI Draft 0.99.7; observed 2026-08-15
    provenance: publicly available ABI specification
    finding: TLSDESC is a resolver-function/argument pair with a specified x86-64 resolver calling convention and relaxation annotation.
  - id: SRC02_GLIBC_TLS_DESC_CHANGE
