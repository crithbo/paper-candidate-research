    provenance: official Sourceware glibc archive
    finding: current test material names TLS descriptor access and `xdlclose` module-lifetime traces; not used as proof of a current absence.
  - id: SRC03_GLIBC_DYNAMIC_LINKER_DOC
    role: CONTRARY
    url: https://sourceware.org/glibc/manual/2.40/html_node/Dynamic-Linker-Hardening.html
    version_or_date: glibc manual 2.40; observed 2026-08-15
    provenance: official glibc documentation
    finding: dynamic loading affects TLS allocation/lifetime conditions.
  - id: SRC04_GLIBC_SOURCE_ROUTE
    role: CURRENT
    url: https://sourceware.org/git/glibc.git
