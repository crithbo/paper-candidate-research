    decisive_observation: `--output-format=vm-bytecode` is default; VMFB is generated as FlatBuffer and loaded/executed by IREE runtime; optional polyglot zip emission changes file-size packaging.
    disposition_effect: flag/packaging alternatives are not a target-specific N2 constructor.
