  - direct fixed-current-ISA same-object primary-paper collision, including the known changed-ISA preprint only as RELATED unless five-field identity holds
  - a non-generic RISC-V-specific action and finite algorithmic guarantee, or a proof that the remainder is generic packing/knapsack/placement
  - finite falsifier and full-cost reconciliation
