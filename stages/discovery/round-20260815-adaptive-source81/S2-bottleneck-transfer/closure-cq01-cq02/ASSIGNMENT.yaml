  candidate_selection_rule: for each query, open at most the first primary paper whose title or abstract explicitly concerns current-ISA RISC-V global-pointer or GP-relative data placement/linker relaxation; skip duplicates and changed-ISA-only papers after recording relation
  evidence_rule: search results are locators only; only the primary paper page or manuscript may support collision analysis
  no_match_rule: bounded no-match remains unresolved and is not novelty or current-absence evidence
fields_to_close:
