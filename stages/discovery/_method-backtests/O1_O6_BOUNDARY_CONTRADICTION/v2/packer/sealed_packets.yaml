        citation: "Vaswani et al. (2017), Attention Is All You Need, NeurIPS 30."
        public_date: 2017-06-12
        url: https://proceedings.neurips.cc/paper/2017/hash/3f5ee243547dee91fbd053c1c4a845aa-Abstract.html
        pre_cutoff_signal: "Self-attention exposes quadratic sequence interactions implemented through dense tensor operations."
      - source_id: P01-B
        citation: "Williams, Waterman, and Patterson (2009), Roofline: An Insightful Visual Performance Model for Multicore Architectures, CACM 52(4)."
        public_date: 2009-04-01
        url: https://doi.org/10.1145/1498765.1498785
        pre_cutoff_signal: "Arithmetic intensity and memory traffic can bound attained performance even when arithmetic complexity is unchanged."
      - source_id: P01-C
        citation: "Kitaev, Kaiser, and Levskaya (2020), Reformer: The Efficient Transformer, ICLR."
        public_date: 2020-01-13
        url: https://openreview.net/forum?id=rkgNKkHtvB
        pre_cutoff_signal: "Long-sequence work largely attacks quadratic attention through approximation or sparsification."
      - source_id: P01-D
        citation: "Katharopoulos et al. (2020), Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention, ICML."
        public_date: 2020-06-03
        url: https://proceedings.mlr.press/v119/katharopoulos20a.html
        pre_cutoff_signal: "A linearized attention family trades the original computation for a different formulation."
      - source_id: P01-E
        citation: "Rabe and Staats (2021), Self-attention Does Not Need O(n^2) Memory."
        public_date: 2021-12-10
        url: https://arxiv.org/abs/2112.05682
        pre_cutoff_signal: "Exact attention can reduce auxiliary memory without changing mathematical attention semantics."
    public_artifacts:
      - source_id: P01-F
        name: "PyTorch scaled dot-product building blocks as available at cutoff"
        snapshot_rule: "Only documentation and repository history dated on or before cutoff."
        url: https://github.com/pytorch/pytorch
    environment_at_cutoff:
      - "The literature separates arithmetic-complexity reductions, exact semantic preservation, and memory-footprint reductions."
      - "The Roofline model makes data movement a first-class performance constraint on hierarchical-memory processors."
      - "No hidden target implementation, name, result, or post-cutoff comparison is supplied."

