packet_design:
  - Freeze only information genuinely available before the target publication cutoff.
  - At least one positive must expose a finite public source route without pre-closing the complete current union, strongest subtractor or complete witness for EXECUTOR.
  - Do not manufacture incompleteness by withholding a decisive direct fatal already present in the admitted source universe.
  - Preserve ambiguity needed to form two or three same-object RQ versions; do not prewrite the answer-bearing RQ.
  - Provide opaque case identities and source-role metadata to EXECUTOR; keep target titles, methods, results and post-cutoff material auditor-only.
  - Keep complete source bytes, hashes, cutoff, license/provenance and contamination decisions in PACKER output.
instructions:
  - Read only AGENTS.md, plan.md, registry.yaml, rules/ROLE_DISCOVERY_BACKTEST.md, the frozen master contract and minimum prior auditor keys needed to exclude reused identities.
  - Use primary papers, official documentation, official source or author artifacts; search pages and snippets cannot substitute for frozen source material.
  - PACKER must not execute, score or simulate RQ_REFINEMENT_STAGED_EVIDENCE_V1.
  - Produce a sealed executor packet, separate AUDITOR_KEY.yaml, SOURCE_LEDGER.yaml, CONTAMINATION_AUDIT.md, handoff.yaml and a targeted manifest.
  - If primary material cannot be frozen or contamination cannot be bounded, fail closed as FAILED_NOT_DISPATCHABLE without scientific inference.
  - Keep validation targeted to packet, key, ledger, contamination audit, handoff and manifest; do not recursively hash unrelated trees.
