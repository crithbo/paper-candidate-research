raw_opportunity: >-
  Object-level hot/cold reorganization improves page homogeneity, while an
  independent memory policy maximizes reclaimed bytes under a slowdown/SLO.
  Examine whether object placement itself can be a same-object constrained
  construction when migration, pointer safety and page costs are all charged.
required_analysis:
  - subtract the strongest sequential composition of layout and SLO policies
  - freeze object semantics, mobility, page size and SLO denominator
  - distinguish a construction from a threshold/controller wrapper
  - defer native trace results to the authorized evidence stage
