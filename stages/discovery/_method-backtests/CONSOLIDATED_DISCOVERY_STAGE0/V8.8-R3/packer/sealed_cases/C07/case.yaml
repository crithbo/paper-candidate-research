raw_opportunity: >-
  Microscaling formats pair quantized payload blocks with scale metadata and
  expose hardware layout constraints. Examine whether view/layout closure or
  scale fragmentation yields a new same-type representation or algorithm,
  without changing the fixed sink type or its required scale association.
required_analysis:
  - freeze the exact payload/scale type and all native legal layouts
  - reject a paired linear-layout product presented under a new name
  - reject multi-scale fragments when they change the target type or guarantee
  - enforce a documentation/source evidence ceiling with no hardware claim
