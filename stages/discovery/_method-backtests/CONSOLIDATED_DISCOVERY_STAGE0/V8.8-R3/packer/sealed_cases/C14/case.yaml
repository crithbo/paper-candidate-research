raw_opportunity: >-
  Heterogeneous-memory runtimes choose placement/migration at page granularity,
  while workloads often exhibit region lifetimes and phase reuse. Examine a
  region-aware construction or lifecycle abstraction under identical memory
  semantics, information and full host/device transfer costs.
required_analysis:
  - compare current heterogeneous-memory controls and strongest simple selector
  - freeze region formation, legal actions and same-information parity
  - include migration, faults, metadata, CPU and device synchronization costs
  - keep analytical/model evidence below native GPU and hardware claims
