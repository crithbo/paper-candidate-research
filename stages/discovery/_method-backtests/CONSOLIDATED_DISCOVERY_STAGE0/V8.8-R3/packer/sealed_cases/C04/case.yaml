raw_opportunity: >-
  Tiered log storage moves immutable segments between local and remote media
  while serving the same consumer offsets and isolation semantics. Explore a
  coupled fetch-hydration, shared in-flight lease and post-lease residency
  transition, without confusing cache residency with retention availability.
required_analysis:
  - inventory all current remote-log, fetch, cache and retention actions
  - freeze one legal transition with unchanged partition/offset semantics
  - charge remote bytes, local disk, broker CPU, tail latency and availability
  - do not package a lifecycle wrapper or an action lacking a finite witness
