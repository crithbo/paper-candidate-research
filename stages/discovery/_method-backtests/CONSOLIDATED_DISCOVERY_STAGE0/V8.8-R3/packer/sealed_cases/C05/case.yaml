raw_opportunity: >-
  Checkpointing under backpressure can align barriers or capture channel state.
  Explore a selective per-edge capture cut coupled to recovery materialization,
  while retaining exactly the same completed-checkpoint and recovery contract.
required_analysis:
  - include aligned, unaligned and timeout/hybrid configurations
  - prove a selective cut is legal before describing an optimizer
  - account for alignment delay, state bytes, recovery time, throughput and CPU
  - abstain when no same-guarantee finite action trace can be frozen
