domain_tags: [COLUMNAR_STORAGE, QUERY_ENGINE, COMPRESSION, NON_CUDA]
raw_opportunity: >-
  A columnar file writer controls row groups, data-page boundaries, page indexes
  and per-column encoding/compression properties, while readers increasingly
  use page pruning and late materialization. Examine whether a same-format
  joint page-boundary construction can improve the filtered-read/full-cost
  surface without changing native reader semantics.
required_analysis:
  - audit the format, current writer properties and current query-engine knobs
  - compare every legal current configuration under identical information
  - freeze decoder/index compatibility, full write cost and read denominator
  - treat implementation and measured gain as later fidelity/evidence work
