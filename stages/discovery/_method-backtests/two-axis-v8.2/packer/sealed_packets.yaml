schema_version: discovery-two-axis-executor-packets-v8.2
confidentiality: EXECUTOR_VISIBLE_DEIDENTIFIED
source_policy: "Cards are de-identified historical source digests. Canonical provenance, source URLs, source hashes, and target identities are exclusively in auditor_key.yaml."
packets:
  L1-P01: {prompt: "A batch data-processing object has reliable shared storage but cluster failures and stragglers make hand-authored parallel execution brittle. Recover a reusable execution abstraction and finite evidence plan.", sources: [precutoff-architecture-survey, precutoff-cluster-failure-report, precutoff-distributed-storage-description], environment: "commodity cluster; public workload traces", claim_ceiling: "system semantics and measured runtime", atomic_gate: "one abstraction must preserve user computation while bounding retry/straggler cost"}
  L1-P02: {prompt: "A distributed computation setting has immutable data and task lineage, but no complete production implementation at cutoff. Decide whether lineage can be a structural residual rather than a wrapper, and give a finite route to test it.", sources: [precutoff-dataflow-paper, precutoff-scheduler-paper, precutoff-lineage-note], environment: "prototype plus replayable traces", claim_ceiling: "prototype/runtime only", atomic_gate: "reconstruction decision must differ from finite recomputation baselines"}
  L1-P03: {prompt: "A globally distributed service needs externally consistent transactions across replicated partitions; existing locality and replication mechanisms expose a cross-boundary semantic conflict. Recover the residual and an evidence route.", sources: [precutoff-transaction-paper, precutoff-clock-paper, precutoff-replication-paper], environment: "multi-site service model", claim_ceiling: "system-level correctness and latency", atomic_gate: "commit ordering must be defined and distinguishable from finite timestamp/quorum controls"}
  L1-N01: {prompt: "A purported consistency-boundary improvement chooses among already enumerated cache, replication, and quorum policies under exactly the same object and objective. Assess whether any residual remains.", sources: [control-policy-catalog, control-baseline-specification], environment: "fixed simulator", claim_ceiling: "none absent nonabsorbed residual", atomic_gate: "abstain if policy union spans proposed choices"}
  L1-N02: {prompt: "A boundary anomaly report varies a timeout and one buffer size on a fixed protocol with no changed state, decision, or guarantee. Assess paper potential.", sources: [control-protocol-description, control-parameter-sweep], environment: "fixed benchmark", claim_ceiling: "measurement only", atomic_gate: "abstain unless a new formal state/action is defined"}
  L2-P01: {prompt: "Large-model training spends a growing fraction of time moving optimizer/model state; compute scaling no longer addresses the bottleneck. Recover a same-object state-placement or communication decision and fair evidence plan.", sources: [precutoff-training-system-paper, precutoff-optimizer-description, precutoff-network-profile], environment: "public training workloads", claim_ceiling: "software-system performance", atomic_gate: "show a costed state partition not reducible to existing data/model parallel modes"}
  L2-P02: {prompt: "Attention computation is memory-traffic limited at realistic sequence lengths. At cutoff, an exact implementation and full benchmark suite are missing, but a finite I/O analysis and kernel route exist. Do not treat that absence as a structural stop.", sources: [precutoff-attention-specification, precutoff-gpu-memory-model, precutoff-kernel-guide], environment: "public GPU programming model", claim_ceiling: "exact algorithm/kernel with bounded numerical claim", atomic_gate: "derive an I/O residual against tiled and materialized controls"}
  L2-P03: {prompt: "Serving many autoregressive requests duplicates growing state and turns memory capacity into the bottleneck. Recover a scheduler/memory representation residual and finite trace-based evidence route.", sources: [precutoff-serving-paper, precutoff-cache-semantics, precutoff-request-trace], environment: "public model and request traces", claim_ceiling: "runtime throughput/latency", atomic_gate: "shared-state decision must preserve request semantics and beat finite batching/cache controls"}
  L2-N01: {prompt: "A training bottleneck proposal merely selects the best of existing sharding, checkpoint, and overlap configurations after the selector has seen the same inputs. Assess whether to abstain.", sources: [control-training-baselines, control-selector-description], environment: "fixed training stack", claim_ceiling: "none", atomic_gate: "abstain if finite selector absorbs all actions"}
  L2-N02: {prompt: "A hardware bottleneck claim compares unmatched model sizes, precision, batch policies, and unavailable devices. Assess potential and evidence readiness separately.", sources: [control-incomplete-benchmark-table, control-device-notes], environment: "unfrozen", claim_ceiling: "none until object is defined", atomic_gate: "abstain because same-object fairness is undefined"}
  L3-P01: {prompt: "Nested records and repeated fields create a natural columnar access structure that row formats fail to exploit. Recover a structural representation/decision residual and evidence plan.", sources: [precutoff-data-model-paper, precutoff-column-store-paper, precutoff-query-workload], environment: "analytic workloads", claim_ceiling: "storage/query execution", atomic_gate: "representation must retain nested semantics under fair row/column controls"}
  L3-P02: {prompt: "A graph workload naturally has skewed degree and limited mutable state. At cutoff, there is no complete system evaluation, but a finite external-memory/partition route is explicit. Recover potential without requiring obtained experiments.", sources: [precutoff-graph-algorithm-paper, precutoff-external-memory-model, precutoff-real-graph-statistics], environment: "public graph corpora", claim_ceiling: "algorithm/system", atomic_gate: "partition schedule must exploit structure beyond a finite block-order baseline"}
  L3-P03: {prompt: "Graph updates and edge streaming expose a natural sequential-access pattern under constrained memory. Recover an execution residual, natural evidence, and a full-cost comparison.", sources: [precutoff-stream-processing-paper, precutoff-graph-workload, precutoff-io-model], environment: "public graph datasets", claim_ceiling: "out-of-core runtime", atomic_gate: "prove/reproduce fewer passes or I/O under same graph semantics"}
  L3-N01: {prompt: "A structure-aware proposal renames a fixed adjacency list and adds no new representation, action, algorithm, or stable workload law. Assess whether it has N1/N2/N3.", sources: [control-standard-representation, control-descriptive-statistics], environment: "fixed", claim_ceiling: "none", atomic_gate: "abstain absent nontrivial novelty route"}
  L3-N02: {prompt: "A claimed natural-structure improvement is supported only by synthetic instances, with no specified corpus, theorem object, access route, or finite measurement plan. Assess separately from paper shape.", sources: [control-synthetic-generator, control-vague-workload-note], environment: "synthetic only", claim_ceiling: "none without finite route", atomic_gate: "abstain because neither natural nor theorem evidence route is finite"}
  L4-P01: {prompt: "A service prioritizes always-writable operation under partition and failure over strong consistency. At cutoff, full production evidence is incomplete, but an application-configurable replication/versioning/quorum design has a finite route. Recover the paper shape.", sources: [precutoff-replication-paper, precutoff-partition-theorem, precutoff-operational-requirements], environment: "failure-injection prototype", claim_ceiling: "system availability/consistency tradeoff", atomic_gate: "explicit contract must differ from fixed-consistency baselines"}
  L4-P02: {prompt: "Microsecond tail latency and CPU efficiency conflict under bursty colocated services. Recover a cross-application allocation decision, fair baseline register, and evidence route.", sources: [precutoff-kernel-bypass-paper, precutoff-tail-latency-paper, precutoff-load-trace], environment: "commodity datacenter server", claim_ceiling: "runtime scheduling", atomic_gate: "reallocation action must retain SLOs while changing cost frontier"}
  L4-P03: {prompt: "Inference serving shifts from average throughput to predictable per-request deadlines and isolation. Recover a centralized control residual and measurable evidence plan.", sources: [precutoff-inference-serving-paper, precutoff-deadline-scheduling-paper, precutoff-gpu-profiling-note], environment: "GPU runtime", claim_ceiling: "software/runtime only", atomic_gate: "action timing and admission must produce a nonabsorbed SLO frontier"}
  L4-N01: {prompt: "A proposal says the objective changed but retains the exact objective, constraints, actions, and evaluation; it only retunes weights. Assess whether it is wrapper/tuning.", sources: [control-objective-definition, control-weight-sweep], environment: "fixed", claim_ceiling: "none", atomic_gate: "abstain if no new decision or contract exists"}
  L4-N02: {prompt: "A latency-versus-cost claim leaves SLO, arrival process, quality, and baseline budgets undefined. Assess structural potential and evidence readiness.", sources: [control-underdetermined-problem, control-incomparable-results], environment: "unfrozen", claim_ceiling: "none", atomic_gate: "abstain because fair comparison is undefined"}
  L5-P01: {prompt: "A streaming summary must answer rank queries with bounded memory; exact materialization does not scale. Recover an approximation residual, guarantee, and finite theorem/experiment route.", sources: [precutoff-streaming-model, precutoff-rank-query-paper, precutoff-lower-bound], environment: "streaming model and public traces", claim_ceiling: "approximation/theory", atomic_gate: "new summary must establish a nontrivial error-space-time frontier"}
  L5-P02: {prompt: "Approximate membership needs less space at large scale. At cutoff, implementation evidence is incomplete, but a finite construction, false-positive proof, and workload route exist. Recover potential without STOP for missing implementation.", sources: [precutoff-bloom-filter-paper, precutoff-hashing-paper, precutoff-memory-model], environment: "theory plus prototype route", claim_ceiling: "probabilistic data structure", atomic_gate: "construction must change the finite space/error/deletion tradeoff"}
  L5-P03: {prompt: "Interactive analysis requires bounded-latency approximate answers over changing data. Recover an online approximation decision and fair full-cost evidence plan.", sources: [precutoff-approximate-query-paper, precutoff-online-algorithm-paper, precutoff-workload-trace], environment: "public analytical traces", claim_ceiling: "approximate system", atomic_gate: "quality-latency frontier must exceed finite sampling/index controls"}
  L5-N01: {prompt: "A scale claim applies a selector over an existing family of sketches and chooses whichever has lowest error after observing the query distribution. Assess whether the selector absorbs it.", sources: [control-sketch-catalog, control-oracle-selector], environment: "fixed", claim_ceiling: "none", atomic_gate: "abstain if candidate action set is subset of control union"}
  L5-N02: {prompt: "An online/approximation paper offers only a known heuristic with a new threshold; it supplies no new guarantee, algorithmic action, data structure, or complexity delta. Assess potential.", sources: [control-known-heuristic, control-threshold-sweep], environment: "fixed", claim_ceiling: "none", atomic_gate: "abstain absent N1/N2/N3"}
  L6-P01: {prompt: "A domain-specific image-processing pipeline has many schedules with equal meaning but radically different locality and parallel cost. Recover an algorithmic scheduling representation and full-cost evidence route.", sources: [precutoff-compiler-ir-paper, precutoff-loop-optimization-paper, precutoff-image-workload], environment: "public compiler/workloads", claim_ceiling: "compiler/runtime", atomic_gate: "schedule search must be semantically exact and nontrivial versus finite optimizing controls"}
  L6-P02: {prompt: "Superoptimization can search instruction expressions but cutoff materials lack complete scale evidence. A finite symbolic equivalence, cost model, and compiler-integration route are available. Recover structural potential separately from readiness.", sources: [precutoff-superoptimization-paper, precutoff-smt-equivalence-paper, precutoff-compiler-ir-spec], environment: "reproducible IR corpus", claim_ceiling: "compiler optimization", atomic_gate: "candidate search must add a nonabsorbed equivalence/cost decision"}
  L6-P03: {prompt: "Equality saturation exposes many equivalent programs; extracting one under a cost model is itself a hard decision. Recover a representation/optimization residual and evidence plan.", sources: [precutoff-egraph-paper, precutoff-extraction-algorithm, precutoff-optimizer-benchmarks], environment: "public rewrite corpus", claim_ceiling: "compiler/optimizer", atomic_gate: "extraction must improve a pinned cost objective beyond finite greedy/order controls"}
  L6-N01: {prompt: "A compiler speedup changes one pass flag on a fixed optimizer and compares only to the default configuration. Assess whether it is ordinary tuning.", sources: [control-compiler-options, control-single-baseline], environment: "fixed compiler", claim_ceiling: "none", atomic_gate: "abstain absent general algorithmic delta and current strong baselines"}
  L6-N02: {prompt: "A code-generation proposal relies on a proprietary corpus that is neither specified nor accessible, gives no theorem object, and has no finite alternative acquisition plan. Assess potential and evidence route.", sources: [control-proprietary-corpus-note, control-vague-mechanism], environment: "unavailable", claim_ceiling: "none", atomic_gate: "abstain because no finite evidence route is defined"}
