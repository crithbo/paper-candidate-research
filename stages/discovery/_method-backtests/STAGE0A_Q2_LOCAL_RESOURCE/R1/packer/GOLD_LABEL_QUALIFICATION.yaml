cases:
  P01_HNSW:
    gold_label: QUALIFIED_POSITIVE
    target_identity: {doi: 10.1109/TPAMI.2018.2889473, venue: IEEE_TPAMI, issue_year: 2020, quality_basis: Q1}
    historical_cutoff: 2016-03-28
    exact_object: approximate nearest-neighbor search over fixed vector/metric datasets
    atomic_action: organize proximity links into hierarchical layers and descend from sparse to dense layers before bounded local search
    mechanism: logarithmic-scale navigation through a hierarchy of small-world proximity graphs
    contribution_type: METHOD_ALGORITHM
    comparator_set: [flat_navigable_small_world_graph, FLANN_tree_family, brute_force_recall_oracle]
    natural_or_canonical_evidence_route: public ANN datasets with recall-versus-query-time and index construction measurements
    full_cost: [index_build_time, index_memory, query_time_or_throughput, recall, parameter_search]
    minimum_falsifier: no recall-time or memory advantage over flat graph/tree baselines at matched build budget
    pre_cutoff_source_count: 3
    historical_union_result: NO_SAME_OBJECT_DIRECT_ABSORPTION_FOUND_IN_FROZEN_SOURCES
    reproducible_route: official hnswlib plus bounded public vectors
