  proposal_sha256: ED7E3457B22D4EC6F1C81448EC328233B281E96EBD0CE4F8F57F85EA36BB3A6B
  handoff_sha256: E8E93538085A43B8800336AE22148635D916334C63C6C51E9CC555CF8EF564F6
  assignment_local_implementation_authorized: true
  shared_patch_authorized: false
authority:
  continuous_until_target: USER_ADAPTIVE_DISCOVERY_CONTINUE_UNTIL_FIVE_STAGEA_PASS_20260814
  bounded_public_acquisition: USER_BLOCKER_AUTONOMOUS_OPEN_SOURCE_ACQUISITION_20260814
  assignment_resource_localization: USER_ASSIGNMENT_RESOURCE_LOCALIZATION_20260814
target: {independent_stagea_gate_pass_count_at_start: 1, independent_stagea_gate_pass_target: 5, stop_new_work_when_target_reached: true}
canonical_method: V8_7_POTENTIAL_READINESS_SEPARATED
discovery_rq_frontend_mode: PRODUCTION
rq_frontend_revision: RQ_REFINEMENT_STAGED_EVIDENCE_V1
discovery_claim_pack_mode: OFF
v9_output_allowed: false
network_security_topics_allowed: false
source40_start_condition:
  source39_six_lane_handoffs_accepted: true
  source39_aggregate: ZERO_EVIDENCE_QUALIFIED_RAW__ZERO_CLEAN_BRIEF
  r34_proposal_accepted_for_one_assignment_local_cycle: true
capacity_change: NONE
proposal_quota: NONE
outcome_aware_backfill: forbidden
non_product_coupling_survival_mode: OFF

stage_separation:
  required_order: SEED_THEN_TWO_OR_THREE_SAME_OBJECT_RQ_VARIANTS_THEN_TARGETED_EVIDENCE_THEN_RAW
  pre_rq_zero_reason_certificate_required: true
  allowed_pre_rq_zero_reasons:
    - OUT_OF_SCOPE
    - EXACT_OR_TERMINAL_IDENTITY_WITH_CERTIFICATE
    - DEFINITIONAL_OBJECT_OR_GUARANTEE_CHANGE
    - LITERAL_DUPLICATE
    - GENERIC_SHELL
    - RQ_ANSWERABILITY_FAILURE
  forbidden_pre_rq_zero_reasons:
    - MISSING_EXACT_VERSION
    - MISSING_CURRENT_SOURCE
    - MISSING_FULL_COST
    - MISSING_WITNESS
    - MISSING_COMPLETE_UNION
  identity_only_carrier_commitment:
    freeze_before_targeted_evidence_outcome: true
    required: TENTATIVE_PUBLIC_OBJECT_ORIGIN_OR_DETERMINISTIC_FIRST_ELIGIBLE_CARRIER_RULE
    metadata_identity_read_allowed: true
    result_union_collision_outcomes_may_change_or_backfill_rq: false
  rq_commitment:
    variants_per_selected_seed: [2, 3]
    freeze_before_targeted_result_lookup:
      - selected_same_object_rq
      - contribution_type
      - estimand_or_action_family
      - minimum_falsifier
      - deterministic_evidence_route

source_closure_scheduler:
  trigger: RQ_COMPLETE_AND_RAW_MISSING_SPECIFIC_PUBLIC_CARRIER_VERSION_CURRENT_LOCUS_OR_FINITE_ORACLE_ROUTE
  nonempty_queue_required_when_triggered: true
  per_lane_closure_max: 2
  deterministic_routes_per_locator_max: 3
  replacement_batch: forbidden
  cheap_questions_max: 3
  cheap_questions:
    - EXACT_CARRIER_VERSION_OR_CURRENT_LOCUS
    - STRONGEST_OBVIOUS_GENERIC_OR_CURRENT_ACTION_ADVERSARY
    - FINITE_ORACLE_OR_FALSIFIER_ROUTE
  downstream_only_debt:
    - COMPLETE_CURRENT_UNION
    - EXHAUSTIVE_LITERATURE_COLLISION
    - FULL_TWO_PLAN_WITNESS
    - MAIN_RESULT
    - Q1_OR_Q2_JUDGMENT
  dispositions:
    - EVIDENCE_QUALIFIED_RAW
    - EXCLUDED_BEFORE_RAW
    - LOCATOR_ONLY
    - SOURCE_CLOSURE_QUEUE_EXHAUSTED__NO_SCIENTIFIC_INFERENCE

selective_depth_model_route:
  breadth_model: gpt-5.6-terra
  breadth_reasoning: medium
  strong_model: gpt-5.6-sol
  strong_reasoning: high
  strong_packets_global_max: 2
  reserved_packet_slots:
    - slot_id: SOURCE40_DEPTH_01
      lane: S3
      selector: FIRST_RQ_COMPLETE_ITEM_WITH_SPECIFIC_PUBLIC_CARRIER_OR_ACTION_GAP
    - slot_id: SOURCE40_DEPTH_02
      lane: S4
      selector: FIRST_RQ_COMPLETE_ITEM_WITH_SPECIFIC_PUBLIC_CARRIER_OR_ESTIMAND_GAP
  reservation_is_not_admission: true
  actual_packet_must_be_frozen_before_targeted_evidence_outcome: true
  actual_packet_required_fields:
    - neutral_rq
    - identity_commitment
    - deterministic_sources
    - closure_questions_max_three
    - minimum_falsifier
    - full_cost_boundary
    - packet_sha256
  lane_must_notify_mainline_before_strong_model_execution: true
  breadth_turn_must_stop_at_PACKET_READY_FOR_MAINLINE_DISPATCH: true
  strong_model_allowed_actions:
    - ASSESS_EXACT_CARRIER_ACTION_ESTIMAND
    - ASSESS_STRONGEST_OBVIOUS_GENERIC_OR_CURRENT_ADVERSARY
    - ASSESS_FINITE_ORACLE_OR_FALSIFIER_ROUTE
  strong_model_forbidden_actions:
    - CHANGE_RQ
    - OUTCOME_AWARE_BACKFILL
    - CLAIM_NOVELTY_OR_Q2
    - WRITE_CLEAN_BRIEF
    - CHANGE_STATE

identity_overrides:
  source25_through_39_same_exact_identity_without_evidence_delta: excluded_before_raw
  opportunity_family_containment_requires_same_object_action_and_endpoint_match: true
  broad_tool_ISA_carrier_paper_or_genealogy_overlap: RELATED_ONLY__NOT_IDENTITY
  OFST_LEXICON_ONLINE_EXACT_RECOURSE: bounded_unresolved__exclude_without_external_delta
  NVPTX_TCGEN05: bounded_unresolved__exclude_without_external_delta
  active_hold_stop_or_saturated_identity: excluded_before_raw
  stop_identity_revival: forbidden

resource_attempt_counter:
  scope: ONE_MONOTONIC_COUNTER_PER_ASSIGNMENT_LANE
  increment_before_every_call: true
  counted_events: [AUTH_REJECT, HTTP_ERROR, NOT_FOUND, ZERO_BYTE, UNPERSISTED_RESPONSE, SUCCESS]
  retry_fallback_or_tool_change_resets_counter: false
  cap_source: INHERITED_ASSIGNMENT_LIMIT
  at_cap: FAIL_CLOSED_BEFORE_NEXT_CALL__NO_SCIENTIFIC_INFERENCE
resource_localization:
  policy: rules/RESOURCE_LOCALIZATION.md
  policy_sha256: A1A1DFB83634F075B2845D57C255CDC53D97B91A6BE5EEFA14953EC4C5B511D4
  mode: MANDATORY_FOR_RESOURCE_PRODUCING_RUNS
  inventory_template: templates/RESOURCE_INVENTORY.yaml
  resource_root_pattern: <assignment_write_directory>/resources
  required_subdirectories: [downloads, archives, src, build, env, cache, tmp, logs]
  process_local_redirects_required: [TEMP, TMP, TMPDIR, tool_download_dir, tool_cache_dir, build_dir, log_dir]
  unreliable_redirect_semantics: FAIL_CLOSED_BEFORE_DOWNLOAD_INSTALL_EXTRACT_BUILD__NO_SCIENTIFIC_INFERENCE
inventory_finalization_gate:
  required_before_handoff: true
  required_consistency: [root_bytes, attempts, entries, finalized_at, validation, retained_file_hashes]
  violation: BLOCK_FURTHER_RESOURCE_PRODUCTION__NO_SCIENTIFIC_INFERENCE

preserved_scientific_gates:
  - Q2_MINIMUM
  - SAME_OBJECT
  - DIRECT_FATAL
  - CURRENT_UNION
  - FAIR_CURRENT_STRONG_BASELINE
  - NATURAL_OR_CANONICAL_CARRIER
  - FULL_COST
  - MINIMUM_FALSIFIER
  - REPRODUCIBILITY
  - CLAIM_CEILING
  - STOP_NON_REVIVAL
completion:
