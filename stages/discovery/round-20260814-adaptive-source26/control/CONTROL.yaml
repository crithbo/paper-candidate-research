profile_id: SOURCE26_EVIDENCE_CLOSURE_TRIAD_V1
scope: ONE_SIX_LANE_ASSIGNMENT_ONLY
authority:
  continuous_discovery: USER_ADAPTIVE_DISCOVERY_CONTINUE_UNTIL_FIVE_STAGEA_PASS_20260814
  bounded_public_acquisition: USER_BLOCKER_AUTONOMOUS_OPEN_SOURCE_ACQUISITION_20260814
activation_record: stages/discovery/round-20260814-adaptive-source26/control/ACTIVATION_RECORD.yaml
canonical_method: V8_7_POTENTIAL_READINESS_SEPARATED
discovery_claim_pack_mode: OFF
v9_output_allowed: false
network_security_topics_allowed: false

creative_frontend:
  seed_ceiling_per_lane: 12
  seed_generation_external_lookup_allowed: false
  minimum_distinct_engines: 4
  perspective_rotation_required: true
  conclusion_first_test_required: true
  clustering_before_locator_selection: true
  seed_counts_as_scientific_denominator: false
  locator_selection: COVERAGE_CONSTRAINED__NO_FORCED_TOP_N
  unselected_seed_backlog: APPEND_ONLY_NON_EVIDENTIARY

capacity:
  evidence_closure_locator_ceiling_per_lane: 4
  fresh_raw_ceiling_per_lane: 4
  C0_ceiling_per_lane: 2
  deep_by_lane: {S1: 2, S2: 2, S3: 2, S4: 3, S5: 1, S6: 2}
  proposal_quota: none
  outcome_aware_backfill: false
  no_replacement_after_precommit: true

precommit_before_lookup:
  required:
    - locator_exact_object_hypothesis
    - target_specific_counterfactual
    - planned_anchor_route
    - planned_current_union_route
    - planned_contrary_route
    - primary_and_fallback_order
  exclude:
    - GENERIC_SHELL
    - ACTIVE_OR_STOP_EXACT_IDENTITY
    - CHANGED_OBJECT_OR_GUARANTEE
    - KNOWN_DIRECT_ABSORPTION
  source_roles: [ANCHOR, CURRENT_UNION, CONTRARY]

retrieval:
  authority: USER_BLOCKER_AUTONOMOUS_OPEN_SOURCE_ACQUISITION_20260814
  trigger: TARGET_SPECIFIC_CONSEQUENCE_AND_PLANNED_OFFICIAL_ROUTE_EXIST
  attempts_per_locator_max: 2
  successful_response_bytes_per_attempt_max: 8388608
  persisted_bytes_per_locator_max: 16777216
  successful_response_bytes_per_lane_max: 67108864
  storage_bytes_per_lane_max: 134217728
  full_dataset_download_required: false
  preferred_sources:
    - official_source_file
    - official_rules_or_schema
    - official_result_export
    - official_API_metadata
    - deterministic_small_slice
    - primary_paper
  required_ledger_fields:
    - url_or_deterministic_rule
    - selection_rule
    - source_role
    - version_or_date
    - license_or_provenance
    - response_bytes
    - sha256
    - disposition
  contrary_not_found_semantics: NOT_FOUND_WITHIN_SEARCH__NOT_GLOBAL_ABSENCE
  build_install_experiment_allowed: false

question_card:
  required_before_fresh_raw: true
  template: templates/DISCOVERY_QUESTION_CARD.md
  finite_closure_route_means: SOURCED_BOUNDED_PATH__NOT_COMPLETED_IMPLEMENTATION_OR_MAIN_RESULT
  incomplete_after_two_routes: LOCATOR_ONLY__PUBLIC_EVIDENCE_UNCLOSED
  missing_implementation_or_result_alone: NOT_A_SCIENTIFIC_DROP
  complete_card_without_main_result: FRESH_RAW_OPPORTUNITY

disposition:
  direct_absorption_or_same_object_failure: STRUCTURAL_DROP
  generic_kernel_or_changed_guarantee: STRUCTURAL_DROP
  public_evidence_unclosed: LOCATOR_ONLY__PUBLIC_EVIDENCE_UNCLOSED
  resource_failure: NO_SCIENTIFIC_INFERENCE__REPORT_BOUNDED_BLOCKER_IF_NEEDED

required_outputs:
  - DIVERGENCE_SEED_POOL.md
  - QUESTION_CARDS.md
  - SOURCE_ROLE_LEDGER.yaml
  - DISCOVERY_LOG.md
  - SOURCE_COLLISION_MATRIX.md
  - handoff.yaml
completion_funnel:
  - seed
  - reported_locator_events
  - auditable_exact_locators
  - retrieval_triggered
  - source_role_closed
  - fresh_raw
  - C0
  - D1
  - deep
  - clean_brief
completion:
  zero_brief_allowed: true
  notify_mainline_on_brief_blocker_or_finish: true
  return_lane_state: IDLE_REUSABLE_AWAITING_MAINLINE
prohibited:
  - V9_output
  - network_security
  - experiment
  - E2
  - build
  - install
  - Stage0_A_B
  - automation
  - outcome_aware_backfill
  - STOP_revival

