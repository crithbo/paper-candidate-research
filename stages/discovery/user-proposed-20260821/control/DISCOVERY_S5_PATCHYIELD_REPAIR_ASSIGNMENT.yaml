objective:
  - Replace fixed-service-time replay as the primary causal evidence. Freeze deterministic live re-execution of each scheduler on the same H100 and software snapshot as the preferred primary route when token/tool identity holds. If a simulator is retained, require calibration on live runs and validation on held-out schedules, including dynamic batching, KV residency/eviction, prefix reuse, recomputation, queue interference, and policy-dependent service time.
