  - Define the deadline relative to each request arrival and freeze one auditable fairness constraint with a numeric threshold and aggregation rule. Separate deadline-success, throughput/full-cost, and fairness outcomes.
  - Localize every future cache, model, container, log, temporary file, and output to the assignment-specific resources tree. Repair scripts so a dry run creates no directories and no default path uses HOME or a global cache.
  - Preserve the frozen model/parser/dataset/agent object and do not download them now.
  - Convert the repaired material into the project's canonical Question Card and TOPIC_BRIEF with a finite Stage A fidelity plan and resource gate.
