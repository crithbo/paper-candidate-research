claims:
  - claim_id: C106-01
    text: Current Ramulator2.1 exposes the scheduler, refresh manager, row policy and address mapper as composable controller components, and documents a plugin extension lifecycle plus command tracing/statistics.
    priority: HIGH
    priority_rationale: determines whether a proposed controller/measurement action is merely a generic extension.
    source_links:
      - source_id: S106-01
        relation: DIRECT
        locator: README controller configuration and extension sections
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: an unspecified refresh-row co-decision or trace-observation add-on is not yet a non-generic residual.
  - claim_id: C106-02
    text: Public PIMSimulator exposes row policy, address mapping and scheduling configuration, but the reviewed public material did not establish an LLM-native, versioned refresh-specific command/trace action.
    priority: HIGH
    priority_rationale: same-object carrier and atomic-action gate.
    source_links:
      - source_id: S106-02
        relation: DIRECT
        locator: README overview, HBM2, address mapping
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: do not infer that a refresh-aware compiler action exists from configurable mapping/policy alone.
      - source_id: S106-03
        relation: DIRECT
        locator: configuration fields
        evidence_status: DIRECT_OBSERVATION
        conflict: none found
        permitted_conclusion: exposed knobs are not evidence of a new same-function algorithm.
  - claim_id: C106-03
    text: RH+ already addresses an LLM-PIM row-locality bottleneck by changing address stride for GEMV; it is related-current, so ordinary row-hit/stride proposals cannot be treated as an untouched residual.
    priority: HIGH
    priority_rationale: latest collision boundary.
    source_links:
      - source_id: S106-05
        relation: OPPOSE
        locator: abstract and method statement
        evidence_status: AUTHOR_CLAIM
        conflict: RH+ does not itself prove full absorption of a separate refresh-specific action.
        permitted_conclusion: retain only an independently evidenced refresh-specific, same-object action; none was found in this closure.
  - claim_id: C106-04
    text: Available public LLM-PIM simulators/carriers already embody row-buffer/interleaving approaches or require generated/architecture-specific traces; reviewed material did not provide a frozen public carrier that preserves native LLM semantics and exposes the proposed refresh action.
    priority: HIGH
    priority_rationale: natural/canonical evidence requirement.
    source_links:
      - source_id: S106-04
        relation: PARTIAL
        locator: README trace-driven ISR interface
        evidence_status: DIRECT_OBSERVATION
        conflict: LLM provenance of test trace not established in reviewed source.
        permitted_conclusion: it is not admitted as the required carrier.
      - source_id: S106-06
